<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Documentation</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        /* ---------- Theme variables ---------- */
        :root {
            --bg: #f9fafb;
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-faint: #94a3b8;
            --toc-hover-bg: #f1f5f9;
            --code-bg: #f1f5f9;
            --code-text: inherit;
            --pre-bg: #1e293b;
            --pre-text: #f8fafc;
            --blockquote-bg: #f8fafc;
            --blockquote-border: #cbd5e1;
            --blockquote-text: #475569;
            --shadow: rgba(0, 0, 0, 0.03);
            --shadow-sidebar: rgba(0, 0, 0, 0.02);
            --error: #b91c1c;

            /* Accent (default: blue) */
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-soft: #eff6ff;
            --accent-border: #3b82f6;
        }

        /* Dark mode variables */
        html[data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #273449;
            --border: #334155;
            --border-strong: #475569;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-faint: #64748b;
            --toc-hover-bg: #273449;
            --code-bg: #273449;
            --code-text: #e2e8f0;
            --pre-bg: #0b1220;
            --pre-text: #e2e8f0;
            --blockquote-bg: #1e293b;
            --blockquote-border: #475569;
            --blockquote-text: #cbd5e1;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-sidebar: rgba(0, 0, 0, 0.2);
            --error: #f87171;
        }

        /* ---------- 7 accent colors ---------- */
        html[data-accent="blue"] {
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-soft: #eff6ff;
            --accent-border: #3b82f6;
        }
        html[data-theme="dark"][data-accent="blue"] {
            --accent: #60a5fa;
            --accent-hover: #93c5fd;
            --accent-soft: #1e3a5f;
            --accent-border: #60a5fa;
        }
        html[data-accent="red"] {
            --accent: #dc2626;
            --accent-hover: #b91c1c;
            --accent-soft: #fef2f2;
            --accent-border: #ef4444;
        }
        html[data-theme="dark"][data-accent="red"] {
            --accent: #f87171;
            --accent-hover: #fca5a5;
            --accent-soft: #4c1d1d;
            --accent-border: #f87171;
        }
        html[data-accent="green"] {
            --accent: #16a34a;
            --accent-hover: #15803d;
            --accent-soft: #f0fdf4;
            --accent-border: #22c55e;
        }
        html[data-theme="dark"][data-accent="green"] {
            --accent: #4ade80;
            --accent-hover: #86efac;
            --accent-soft: #14432a;
            --accent-border: #4ade80;
        }
        html[data-accent="purple"] {
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --accent-soft: #f5f3ff;
            --accent-border: #8b5cf6;
        }
        html[data-theme="dark"][data-accent="purple"] {
            --accent: #a78bfa;
            --accent-hover: #c4b5fd;
            --accent-soft: #2e1f5e;
            --accent-border: #a78bfa;
        }
        html[data-accent="orange"] {
            --accent: #ea580c;
            --accent-hover: #c2410c;
            --accent-soft: #fff7ed;
            --accent-border: #f97316;
        }
        html[data-theme="dark"][data-accent="orange"] {
            --accent: #fb923c;
            --accent-hover: #fdba74;
            --accent-soft: #4a2508;
            --accent-border: #fb923c;
        }
        html[data-accent="pink"] {
            --accent: #db2777;
            --accent-hover: #be185d;
            --accent-soft: #fdf2f8;
            --accent-border: #ec4899;
        }
        html[data-theme="dark"][data-accent="pink"] {
            --accent: #f472b6;
            --accent-hover: #f9a8d4;
            --accent-soft: #4a1530;
            --accent-border: #f472b6;
        }
        html[data-accent="teal"] {
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --accent-soft: #f0fdfa;
            --accent-border: #14b8a6;
        }
        html[data-theme="dark"][data-accent="teal"] {
            --accent: #2dd4bf;
            --accent-hover: #5eead4;
            --accent-soft: #0f3d3a;
            --accent-border: #2dd4bf;
        }

        /* ---------- Global ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            color-scheme: light dark;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            min-height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
            overflow-y: auto;
            height: 100vh;
            position: sticky;
            top: 0;
            box-shadow: 2px 0 8px var(--shadow-sidebar);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .sidebar.hidden {
            display: none;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            margin: 0;
            word-break: break-word;
        }

        .theme-toggle {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            background: var(--toc-hover-bg);
            color: var(--text);
        }

        /* TOC */
        .toc-list {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .toc-list li {
            margin: 0.3rem 0;
        }

        .toc-list a {
            display: block;
            padding: 0.35rem 0.5rem;
            color: var(--text);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            word-break: break-word;
            border-left: 3px solid transparent;
        }

        .toc-list a:hover {
            background-color: var(--toc-hover-bg);
            color: var(--text);
        }

        .toc-list a.active {
            background-color: var(--accent-soft);
            color: var(--accent);
            border-left-color: var(--accent-border);
            font-weight: 500;
        }

        .toc-level-1 a { font-weight: 600; font-size: 0.95rem; padding-left: 0.5rem; }
        .toc-level-2 a { padding-left: 1.25rem; }
        .toc-level-3 a { padding-left: 2rem; font-size: 0.85rem; }
        .toc-level-4 a { padding-left: 2.75rem; font-size: 0.8rem; }
        .toc-level-5 a { padding-left: 3.5rem; font-size: 0.8rem; }
        .toc-level-6 a { padding-left: 4.25rem; font-size: 0.75rem; }

        .toc-placeholder {
            color: var(--text-faint);
            font-size: 0.85rem;
            padding-left: 0.5rem;
        }

        /* ---------- Main content ---------- */
        .main-content {
            flex: 1;
            padding: 2rem 2.5rem;
            max-width: 1000px;
            margin: 0 auto;
            overflow-x: auto;
        }

        #content {
            background: var(--surface);
            border-radius: 12px;
            padding: 2rem 2.5rem;
            box-shadow: 0 4px 12px var(--shadow);
            border: 1px solid var(--border);
            min-height: 200px;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .loading {
            color: var(--text-muted);
            font-style: italic;
            padding: 1rem 0;
        }

        .error {
            color: var(--error);
        }

        /* Markdown styles */
        #content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
            margin-top: 1.5em;
            margin-bottom: 0.6em;
            font-weight: 600;
            line-height: 1.3;
            scroll-margin-top: 20px;
            color: var(--text);
        }
        #content h1 { font-size: 2rem; border-bottom: 2px solid var(--accent-border); padding-bottom: 0.3rem; }
        #content h2 { font-size: 1.6rem; border-bottom: 1px solid var(--border); padding-bottom: 0.2rem; }
        #content h3 { font-size: 1.3rem; }
        #content h4 { font-size: 1.1rem; }
        #content p { margin: 0.8rem 0; }
        #content a { color: var(--accent); text-decoration: none; }
        #content a:hover { text-decoration: underline; color: var(--accent-hover); }
        #content code {
            background: var(--code-bg);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: var(--code-text);
        }
        #content pre {
            background: var(--pre-bg);
            color: var(--pre-text);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
        }
        #content pre code {
            background: transparent;
            padding: 0;
            color: inherit;
            font-size: 0.9em;
        }
        #content blockquote {
            border-left: 4px solid var(--accent-border);
            margin: 1rem 0;
            padding: 0.5rem 0 0.5rem 1rem;
            color: var(--blockquote-text);
            background: var(--blockquote-bg);
            border-radius: 0 6px 6px 0;
        }
        #content ul, #content ol {
            padding-left: 1.8rem;
            margin: 0.8rem 0;
        }
        #content img {
            max-width: 100%;
            border-radius: 6px;
        }
        #content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5rem 0;
        }
        #content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
        }
        #content th, #content td {
            border: 1px solid var(--border);
            padding: 0.5rem 0.75rem;
            text-align: left;
        }
        #content th {
            background: var(--surface-2);
        }
        #content th { border-bottom: 2px solid var(--accent-border); }

        /* Debug panel */
        .debug-box {
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-top: 1rem;
        }
        .debug-box h3 {
            margin-top: 0 !important;
            font-size: 1rem !important;
            color: var(--error);
            border: none !important;
        }
        .debug-box .kv {
            display: flex;
            gap: 0.5rem;
            margin: 0.35rem 0;
            font-size: 0.9rem;
            word-break: break-all;
        }
        .debug-box .kv strong {
            flex-shrink: 0;
            color: var(--text-muted);
            min-width: 8em;
        }
        .debug-box pre {
            margin-top: 0.75rem;
            font-size: 0.8rem;
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 700px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 220px;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 1rem;
            }
            .main-content {
                padding: 1rem;
            }
            #content {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 id="toc-title">Table of Contents</h3>
            <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
                <!-- Icon injected by JS -->
            </button>
        </div>
        <ul class="toc-list" id="toc-list">
            <li class="toc-placeholder">No headings yet</li>
        </ul>
    </aside>

    <div class="main-content">
        <main id="content">
            <p class="loading">loading...</p>
        </main>
    </div>

    <script>
        (function() {
            // ============================================================
            // 0. Theme (dark/light) logic
            // ============================================================
            const THEME_KEY = 'qd-theme';
            const htmlEl = document.documentElement;
            const themeToggleBtn = document.getElementById('theme-toggle');
            const tocTitleEl = document.getElementById('toc-title');
            const sidebarEl = document.getElementById('sidebar');

            function getPreferredTheme() {
                const stored = localStorage.getItem(THEME_KEY);
                if (stored === 'light' || stored === 'dark') return stored;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            function applyTheme(theme) {
                htmlEl.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    themeToggleBtn.innerHTML = '☀️';
                    themeToggleBtn.title = 'Switch to light mode';
                } else {
                    themeToggleBtn.innerHTML = '🌙';
                    themeToggleBtn.title = 'Switch to dark mode';
                }
            }

            let currentTheme = getPreferredTheme();
            applyTheme(currentTheme);

            themeToggleBtn.addEventListener('click', () => {
                currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
                applyTheme(currentTheme);
                localStorage.setItem(THEME_KEY, currentTheme);
            });

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!localStorage.getItem(THEME_KEY)) {
                    currentTheme = e.matches ? 'dark' : 'light';
                    applyTheme(currentTheme);
                }
            });

            // ============================================================
            // 1. Parse URL params (?file&theme=red&sidebar-title=xxx)
            // ============================================================
            const searchStr = window.location.search;
            const urlParams = {};
            let pageName = 'README';
            let urlParseError = null;

            if (searchStr.length > 1) {
                try {
                    const raw = searchStr.substring(1);
                    const parts = raw.split('&');
                    parts.forEach((part, idx) => {
                        if (idx === 0 && !part.includes('=')) {
                            pageName = decodeURIComponent(part);
                        } else if (part.includes('=')) {
                            const eq = part.indexOf('=');
                            const k = part.slice(0, eq);
                            const v = part.slice(eq + 1);
                            urlParams[decodeURIComponent(k)] = decodeURIComponent(v);
                        }
                    });
                } catch (e) {
                    urlParseError = e;
                }
            }

            const ACCENTS = ['blue', 'red', 'green', 'purple', 'orange', 'pink', 'teal'];

            document.title = `${pageName} - Quick Documentation`;
            const fetchUrl = `${pageName}.md?t=${new Date().getTime()}`;

            const contentEl = document.getElementById('content');
            const tocListEl = document.getElementById('toc-list');

            // ============================================================
            // 2. Front-matter parsing (no dependency, lenient)
            // ============================================================
            function parseFrontMatter(text) {
                const meta = {};
                const result = { meta, body: text, rawFrontMatter: null };
                const trimmed = text.replace(/^\uFEFF/, '').replace(/^\s+/, '');
                if (!trimmed.startsWith('---')) return result;

                const lines = trimmed.split(/\r?\n/);
                if (lines[0].trim() !== '---') return result;

                let endIdx = -1;
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '---') {
                        endIdx = i;
                        break;
                    }
                }
                if (endIdx === -1) return result;

                result.rawFrontMatter = lines.slice(0, endIdx + 1).join('\n');

                const metaLines = lines.slice(1, endIdx);
                metaLines.forEach(line => {
                    const m = line.match(/^\s*([A-Za-z0-9_-]+)\s*:\s*(.*)$/);
                    if (m) {
                        let value = m[2].trim();
                        if ((value.startsWith('"') && value.endsWith('"')) ||
                            (value.startsWith("'") && value.endsWith("'"))) {
                            value = value.slice(1, -1);
                        }
                        meta[m[1]] = value;
                    }
                });

                result.body = lines.slice(endIdx + 1).join('\n');
                return result;
            }

            function applyMeta(meta) {
                const theme = urlParams['theme'] || meta['theme'];
                if (theme && ACCENTS.includes(theme)) {
                    htmlEl.setAttribute('data-accent', theme);
                } else {
                    htmlEl.setAttribute('data-accent', 'blue');
                }

                const sidebarTitle = urlParams['sidebar-title'] || meta['sidebar-title'];
                if (sidebarTitle) {
                    tocTitleEl.textContent = sidebarTitle;
                }

                const docTitle = urlParams['doc-title'] || meta['doc-title'];
                document.title = docTitle
                    ? `${docTitle} - Quick Documentation`
                    : `${pageName} - Quick Documentation`;

                const hideToc = urlParams['hide-toc'] || meta['hide-toc'];
                if (hideToc === 'true' || hideToc === '1') {
                    sidebarEl.classList.add('hidden');
                }
            }

            // ============================================================
            // 3. Generate TOC
            // ============================================================
            function generateTOC() {
                const headings = contentEl.querySelectorAll('h1, h2, h3, h4, h5, h6');
                if (headings.length === 0) {
                    tocListEl.innerHTML = '<li class="toc-placeholder">No headings found</li>';
                    return;
                }

                const tocItems = [];

                headings.forEach((heading, index) => {
                    if (!heading.id) {
                        const text = heading.textContent.trim().toLowerCase()
                            .replace(/[^a-z0-9\s-]/g, '')
                            .replace(/\s+/g, '-')
                            .replace(/-+/g, '-');
                        const baseId = text || `heading-${index}`;
                        let uniqueId = baseId;
                        let counter = 1;
                        while (document.getElementById(uniqueId)) {
                            uniqueId = `${baseId}-${counter}`;
                            counter++;
                        }
                        heading.id = uniqueId;
                    }

                    const level = parseInt(heading.tagName.substring(1));
                    const id = heading.id;
                    const text = heading.textContent.trim();

                    tocItems.push(`
                        <li class="toc-level-${level}">
                            <a href="#${id}" data-target="${id}">${text}</a>
                        </li>
                    `);
                });

                tocListEl.innerHTML = tocItems.join('');

                const tocLinks = tocListEl.querySelectorAll('a');
                tocLinks.forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        const targetId = this.dataset.target;
                        const targetEl = document.getElementById(targetId);
                        if (targetEl) {
                            targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            history.pushState(null, null, `#${targetId}`);
                            tocLinks.forEach(l => l.classList.remove('active'));
                            this.classList.add('active');
                        }
                    });
                });

                setupScrollSpy(headings);
            }

            // ============================================================
            // 4. Scroll spy highlight
            // ============================================================
            function setupScrollSpy(headings) {
                if (headings.length === 0) return;

                const tocLinks = tocListEl.querySelectorAll('a');
                const linkMap = new Map();
                tocLinks.forEach(link => {
                    linkMap.set(link.dataset.target, link);
                });

                const observerOptions = {
                    root: null,
                    rootMargin: '0px 0px -20% 0px',
                    threshold: 0.1
                };

                let activeId = null;

                const observer = new IntersectionObserver((entries) => {
                    const visibleEntries = entries.filter(entry => entry.isIntersecting);
                    if (visibleEntries.length === 0) return;

                    let topEntry = visibleEntries[0];
                    visibleEntries.forEach(entry => {
                        if (entry.boundingClientRect.top < topEntry.boundingClientRect.top) {
                            topEntry = entry;
                        }
                    });

                    const newActiveId = topEntry.target.id;
                    if (newActiveId !== activeId) {
                        activeId = newActiveId;
                        tocLinks.forEach(link => link.classList.remove('active'));
                        const activeLink = linkMap.get(activeId);
                        if (activeLink) activeLink.classList.add('active');
                    }
                }, observerOptions);

                headings.forEach(heading => observer.observe(heading));
            }

            // ============================================================
            // 5. Staged error handling + detailed debug output
            // ============================================================
            function showDebugPanel(info) {
                const rows = Object.entries(info).map(([k, v]) =>
                    `<div class="kv"><strong>${k}</strong><span>${String(v)}</span></div>`
                ).join('');

                return `
                    <div class="debug-box">
                        <h3>⚠ Failed to load — Debug info</h3>
                        ${rows}
                    </div>
                `;
            }

            let stage = 'init';
            let rawText = null;
            let parsed = null;

            if (urlParseError) {
                stage = 'url-parse';
                contentEl.innerHTML = `<h1>Failed to parse URL parameters</h1>` + showDebugPanel({
                    'Error': urlParseError.message || String(urlParseError),
                    'Search': searchStr
                });
                tocListEl.innerHTML = '<li class="toc-placeholder">Content unavailable</li>';
                return;
            }

            stage = 'fetch';
            fetch(fetchUrl)
                .then(response => {
                    if (!response.ok) {
                        const e = new Error(`File not found (HTTP ${response.status} ${response.statusText})`);
                        e.stage = 'http';
                        e.status = response.status;
                        e.url = response.url;
                        throw e;
                    }
                    stage = 'read-text';
                    return response.text();
                })
                .then(text => {
                    rawText = text;
                    stage = 'front-matter';
                    try {
                        parsed = parseFrontMatter(text);
                    } catch (e) {
                        e.stage = 'front-matter';
                        throw e;
                    }

                    stage = 'apply-meta';
                    try {
                        applyMeta(parsed.meta);
                    } catch (e) {
                        e.stage = 'apply-meta';
                        throw e;
                    }

                    stage = 'marked-parse';
                    let html;
                    try {
                        if (typeof marked === 'undefined' || !marked.parse) {
                            throw new Error('marked library not loaded (CDN blocked or network issue)');
                        }
                        html = marked.parse(parsed.body);
                    } catch (e) {
                        e.stage = 'marked-parse';
                        throw e;
                    }

                    stage = 'render';
                    try {
                        contentEl.innerHTML = html;
                    } catch (e) {
                        e.stage = 'render';
                        throw e;
                    }

                    stage = 'toc';
                    try {
                        generateTOC();
                    } catch (e) {
                        console.warn('TOC generation failed (content still displayed):', e);
                    }

                    stage = 'done';

                    if (window.MathJax && MathJax.typesetPromise) {
                        MathJax.typesetPromise([contentEl]).catch((err) => console.warn('MathJax error:', err));
                    }
                })
                .catch(err => {
                    console.error('[QD] load failed at stage:', stage, err);

                    const msg = (err && (err.message || String(err))) || 'Unknown error';
                    const isFetchTypeError = err instanceof TypeError;
                    const isHttp = err.stage === 'http' || /HTTP \d+/.test(msg);

                    let title, hint;
                    if (isFetchTypeError && stage === 'fetch') {
                        title = 'Network request failed (fetch threw TypeError)';
                        hint = 'fetch itself failed: wrong path, CORS, offline, or cross-origin under file://.';
                    } else if (isHttp) {
                        title = `File not found or not served (HTTP ${err.status || '?'})`;
                        hint = 'Server returned a non-2xx status. Check the file was uploaded, the path/case, or whether GitHub Pages (Jekyll) is ignoring it. Visit the URL below to verify.';
                    } else if (stage === 'front-matter') {
                        title = 'Front-matter parsing failed';
                        hint = 'Error while parsing the leading --- block. Check for invisible characters or malformed syntax.';
                    } else if (stage === 'apply-meta') {
                        title = 'Failed to apply front-matter metadata';
                        hint = 'Error while handling theme / sidebar-title / doc-title / hide-toc.';
                    } else if (stage === 'marked-parse') {
                        title = 'Markdown rendering failed (marked.parse)';
                        hint = 'Error while rendering the body with marked. The library may not have loaded, or the body contains problematic content.';
                    } else if (stage === 'render') {
                        title = 'DOM render failed';
                        hint = 'Error while writing HTML into the page.';
                    } else {
                        title = 'Unknown error stage';
                        hint = 'See the stack trace below.';
                    }

                    const debugInfo = {
                        'Stage': stage,
                        'Error type': err && err.name ? err.name : typeof err,
                        'Error message': msg,
                        'Request URL': fetchUrl,
                        'Page param': pageName,
                        'HTTP status': err && err.status ? err.status : 'N/A',
                        'Raw text length': rawText ? rawText.length : 'N/A',
                        'Raw text first 80 chars': rawText ? JSON.stringify(rawText.slice(0, 80)) : 'N/A',
                        'Front-matter raw': parsed && parsed.rawFrontMatter
                            ? JSON.stringify(parsed.rawFrontMatter)
                            : 'N/A',
                        'Parsed meta': parsed ? JSON.stringify(parsed.meta) : 'N/A',
                        'Body first 80 chars': parsed ? JSON.stringify(parsed.body.slice(0, 80)) : 'N/A'
                    };

                    contentEl.innerHTML = `
                        <h1 style="color:var(--error)">${title}</h1>
                        <p style="color:var(--error)"><strong>Hint:</strong> ${hint}</p>
                        ${showDebugPanel(debugInfo)}
                        <details style="margin-top:1rem">
                            <summary style="cursor:pointer;color:var(--text-muted)">Original stack trace</summary>
                            <pre style="white-space:pre-wrap;font-size:0.8em">${(err && err.stack) || msg}</pre>
                        </details>
                    `;
                    tocListEl.innerHTML = '<li class="toc-placeholder">Content unavailable</li>';
                });
        })();
    </script>
</body>
</html>

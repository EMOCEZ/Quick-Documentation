<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Documentation</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- 顶部控制栏 -->
    <div class="top-bar">
        <span>Quick Docs</span>
        <button id="theme-toggle">🌙 暗色</button>
    </div>

    <!-- 页面主体容器 -->
    <div class="container">
        <!-- 侧边栏目录 -->
        <aside id="sidebar">
            <h3>目录</h3>
            <ul id="toc-list"></ul>
        </aside>
        
        <!-- 文档内容 -->
        <main id="content">
            <p>正在加载文档...</p>
        </main>
    </div>

    <script>
        // === 1. 亮暗切换逻辑 ===
        const themeBtn = document.getElementById('theme-toggle');
        const htmlEl = document.documentElement;

        // 检查本地存储或系统偏好
        const savedTheme = localStorage.getItem('theme') || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        htmlEl.setAttribute('data-theme', savedTheme);
        updateButtonText(savedTheme);

        themeBtn.addEventListener('click', () => {
            const current = htmlEl.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            htmlEl.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateButtonText(next);
        });

        function updateButtonText(theme) {
            themeBtn.textContent = theme === 'light' ? '🌙 暗色' : '☀️ 亮色';
        }

        // === 2. 加载 Markdown 和生成目录 ===
        const urlParams = new URLSearchParams(window.location.search);
        const pageName = urlParams.keys().next().value || 'cursedgold';

        fetch(`${pageName}.md`)
            .then(response => {
                if (!response.ok) throw new Error('找不到文件');
                return response.text();
            })
            .then(text => {
                // 渲染 HTML
                const html = marked.parse(text);
                document.getElementById('content').innerHTML = html;

                // 生成侧边栏目录
                generateTOC();
            })
            .catch(err => {
                document.getElementById('content').innerHTML = `<h1>404</h1><p>无法加载：${pageName}.md</p>`;
            });

        // 提取内容里的 h2 和 h3 生成目录
        function generateTOC() {
            const tocList = document.getElementById('toc-list');
            const headings = document.querySelectorAll('#content h2, #content h3');
            
            if (headings.length === 0) {
                document.getElementById('sidebar').style.display = 'none';
                return;
            }

            headings.forEach((heading, index) => {
                // 给标题加一个唯一的 id 用于跳转
                const id = `heading-${index}`;
                heading.id = id;

                // 创建列表项
                const li = document.createElement('li');
                li.className = heading.tagName.toLowerCase(); // h2 或 h3 类名
                
                const a = document.createElement('a');
                a.href = `#${id}`;
                a.textContent = heading.textContent;
                
                // 平滑滚动
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    heading.scrollIntoView({ behavior: 'smooth' });
                });

                li.appendChild(a);
                tocList.appendChild(li);
            });
        }
    </script>
</body>
</html>

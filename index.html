<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Documentation</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <main id="content">
        <p>loading...</p>
    </main>

    <script>
        // 1. 分割 URL 获取参数
        const searchStr = window.location.search;
        let pageName = 'README'; // 默认页
        
        // 如果 URL 里有参数，例如 ?cursedgold，则提取出来
        if (searchStr.length > 1) {
            // 去掉开头的问号，并且用 & 分割（防止有人用 ?page=cursedgold 的写法）
            pageName = searchStr.substring(1).split('&')[0]; 
            // 如果里面包含等号（比如 ?name=cursedgold），取等号后面的部分
            if (pageName.includes('=')) {
                pageName = pageName.split('=')[1];
            }
        }

        // 2. 动态设置网页标题
        document.title = `${pageName} - Quick Documentation`;

        // 3. 拼接时间戳，强制浏览器不走缓存！
        const fetchUrl = `${pageName}.md?t=${new Date().getTime()}`;

        // 4. 开始读取
        fetch(fetchUrl)
            .then(response => {
                if (!response.ok) throw new Error('找不到文件');
                return response.text();
            })
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('content').innerHTML = `
                    <h1>404 Not Found</h1>
                    <p>无法加载文档：<code>${pageName}.md</code></p>
                `;
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Documentation</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es6/tex-mml-chtml.js"></script>
    <style>
        /* ---------- Base Variables ---------- */
        :root {
            --shadow: rgba(0, 0, 0, 0.04);
            --shadow-sidebar: rgba(0, 0, 0, 0.02);
            --error: #b91c1c;
            
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-faint: #94a3b8;
            --toc-hover-bg: #f1f5f9;
            
            --code-bg: rgba(0, 0, 0, 0.05);
            --pre-bg: #1e293b;
            --pre-text: #f8fafc;
            --blockquote-bg: rgba(0, 0, 0, 0.02);
            --blockquote-text: #475569;
        }

        /* ---------- Base Dark Mode ---------- */
        html[data-theme="dark"] {
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-sidebar: rgba(0, 0, 0, 0.2);
            --error: #f87171;
            
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-faint: #64748b;
            --toc-hover-bg: rgba(255, 255, 255, 0.05);
            
            --code-bg: rgba(255, 255, 255, 0.1);
            --pre-bg: #0b1220;
            --pre-text: #e2e8f0;
            --blockquote-bg: rgba(255, 255, 255, 0.03);
            --blockquote-text: #cbd5e1;
        }

        /* ---------- 7 Accent Colors ---------- */
        html[data-accent="blue"] {
            --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9;
            --border: #e2e8f0; --border-strong: #cbd5e1;
            --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: #eff6ff; --accent-border: #3b82f6;
        }
        html[data-theme="dark"][data-accent="blue"] {
            --bg: #0b1120; --surface: #111a2e; --surface-2: #1b263e; --border: #2a3b5c;
            --accent: #60a5fa; --accent-hover: #93c5fd; --accent-soft: #1e3a5f; --accent-border: #60a5fa;
        }
        html[data-accent="red"] {
            --bg: #fefafa; --surface: #ffffff; --surface-2: #fef2f2;
            --border: #fee2e2; --border-strong: #fca5a5;
            --accent: #dc2626; --accent-hover: #b91c1c; --accent-soft: #fef2f2; --accent-border: #ef4444;
        }
        html[data-theme="dark"][data-accent="red"] {
            --bg: #140b0b; --surface: #1f1010; --surface-2: #2c1515; --border: #4a2222;
            --accent: #f87171; --accent-hover: #fca5a5; --accent-soft: #4c1d1d; --accent-border: #f87171;
        }
        html[data-accent="green"] {
            --bg: #f9fdfa; --surface: #ffffff; --surface-2: #f0fdf4;
            --border: #dcfce7; --border-strong: #86efac;
            --accent: #16a34a; --accent-hover: #15803d; --accent-soft: #f0fdf4; --accent-border: #22c55e;
        }
        html[data-theme="dark"][data-accent="green"] {
            --bg: #0a140e; --surface: #101f15; --surface-2: #182e1f; --border: #264d33;
            --accent: #4ade80; --accent-hover: #86efac; --accent-soft: #14432a; --accent-border: #4ade80;
        }
        html[data-accent="purple"] {
            --bg: #fcfbfe; --surface: #ffffff; --surface-2: #f5f3ff;
            --border: #ede9fe; --border-strong: #c4b5fd;
            --accent: #7c3aed; --accent-hover: #6d28d9; --accent-soft: #f5f3ff; --accent-border: #8b5cf6;
        }
        html[data-theme="dark"][data-accent="purple"] {
            --bg: #100a1c; --surface: #181026; --surface-2: #221736; --border: #38265c;
            --accent: #a78bfa; --accent-hover: #c4b5fd; --accent-soft: #2e1f5e; --accent-border: #a78bfa;
        }
        html[data-accent="orange"] {
            --bg: #fffaf7; --surface: #ffffff; --surface-2: #fff7ed;
            --border: #ffedd5; --border-strong: #fdba74;
            --accent: #ea580c; --accent-hover: #c2410c; --accent-soft: #fff7ed; --accent-border: #f97316;
        }
        html[data-theme="dark"][data-accent="orange"] {
            --bg: #150d08; --surface: #20140d; --surface-2: #2e1c12; --border: #4a2c1c;
            --accent: #fb923c; --accent-hover: #fdba74; --accent-soft: #4a2508; --accent-border: #fb923c;
        }
        html[data-accent="pink"] {
            --bg: #fffbfd; --surface: #ffffff; --surface-2: #fdf2f8;
            --border: #fce7f3; --border-strong: #f9a8d4;
            --accent: #db2777; --accent-hover: #be185d; --accent-soft: #fdf2f8; --accent-border: #ec4899;
        }
        html[data-theme="dark"][data-accent="pink"] {
            --bg: #140a10; --surface: #1f101a; --surface-2: #2e1626; --border: #4a233d;
            --accent: #f472b6; --accent-hover: #f9a8d4; --accent-soft: #4a1530; --accent-border: #f472b6;
        }
        html[data-accent="teal"] {
            --bg: #f8fdfc; --surface: #ffffff; --surface-2: #f0fdfa;
            --border: #ccfbf1; --border-strong: #5eead4;
            --accent: #0d9488; --accent-hover: #0f766e; --accent-soft: #f0fdfa; --accent-border: #14b8a6;
        }
        html[data-theme="dark"][data-accent="teal"] {
            --bg: #081413; --surface: #0d1f1e; --surface-2: #142e2d; --border: #1f4a47;
            --accent: #2dd4bf; --accent-hover: #5eead4; --accent-soft: #0f3d3a; --accent-border: #2dd4bf;
        }

        /* ---------- Global ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            color-scheme: light dark;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            min-height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
            overflow-y: auto;
            height: 100vh;
            position: sticky;
            top: 0;
            box-shadow: 2px 0 8px var(--shadow-sidebar);
            transition: background-color 0.25s ease, border-color 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .sidebar.hidden {
            display: none;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            margin: 0;
            word-break: break-word;
        }

        .theme-toggle {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            background: var(--toc-hover-bg);
            color: var(--text);
        }

        /* TOC */
        .toc-list {
            list-style: none;
            padding-left: 0;
            margin: 0;
            flex: 1; /* 撑开底部 */
        }

        .toc-list li { margin: 0.3rem 0; }

        .toc-list a {
            display: block;
            padding: 0.35rem 0.5rem;
            color: var(--text);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            word-break: break-word;
            border-left: 3px solid transparent;
        }

        .toc-list a:hover { background-color: var(--toc-hover-bg); color: var(--text); }
        .toc-list a.active {
            background-color: var(--accent-soft); color: var(--accent);
            border-left-color: var(--accent-border); font-weight: 500;
        }

        .toc-level-1 a { font-weight: 600; font-size: 0.95rem; padding-left: 0.5rem; }
        .toc-level-2 a { padding-left: 1.25rem; }
        .toc-level-3 a { padding-left: 2rem; font-size: 0.85rem; }
        .toc-level-4 a { padding-left: 2.75rem; font-size: 0.8rem; }
        .toc-level-5 a { padding-left: 3.5rem; font-size: 0.8rem; }
        .toc-level-6 a { padding-left: 4.25rem; font-size: 0.75rem; }

        .toc-placeholder { color: var(--text-faint); font-size: 0.85rem; padding-left: 0.5rem; }

        /* ---------- Main Content ---------- */
        .main-content {
            flex: 1;
            padding: 2rem 2.5rem;
            max-width: 1000px;
            margin: 0 auto;
            overflow-x: auto;
            display: flex;
            flex-direction: column;
            justify-content: center; 
        }

        #content {
            background: var(--surface);
            border-radius: 12px;
            padding: 2rem 2.5rem;
            box-shadow: 0 4px 12px var(--shadow);
            border: 1px solid var(--border);
            min-height: 200px;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .loading { color: var(--text-muted); font-style: italic; padding: 1rem 0; }

        /* ---------- Error Box ---------- */
        .error-box {
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            border-left: 4px solid var(--error);
            border-radius: 6px;
            padding: 1rem 1.25rem;
            margin-top: 1rem;
        }
        .error-box h3 { margin-top: 0 !important; font-size: 1.1rem !important; color: var(--error); border: none !important; }
        .error-box p { font-size: 0.95rem; color: var(--text-muted); }

        /* ---------- Markdown Styles ---------- */
        #content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
            margin-top: 1.5em; margin-bottom: 0.6em;
            font-weight: 600; line-height: 1.3; scroll-margin-top: 20px; color: var(--text);
        }
        #content h1 { font-size: 2rem; border-bottom: 2px solid var(--accent-border); padding-bottom: 0.3rem; }
        #content h2 { font-size: 1.6rem; border-bottom: 1px solid var(--border); padding-bottom: 0.2rem; }
        #content h3 { font-size: 1.3rem; }
        #content h4 { font-size: 1.1rem; }
        #content p { margin: 0.8rem 0; }
        #content a { color: var(--accent); text-decoration: none; }
        #content a:hover { text-decoration: underline; color: var(--accent-hover); }
        
        #content code {
            background: var(--code-bg); padding: 0.2rem 0.4rem; border-radius: 4px;
            font-size: 0.9em; font-family: 'SF Mono', 'Fira Code', monospace; color: var(--text);
        }
        #content pre {
            background: var(--pre-bg); color: var(--pre-text); padding: 1rem;
            border-radius: 8px; overflow-x: auto; margin: 1rem 0;
        }
        #content pre code { background: transparent; padding: 0; color: inherit; font-size: 0.9em; }
        #content blockquote {
            border-left: 4px solid var(--accent-border); margin: 1rem 0;
            padding: 0.5rem 0 0.5rem 1rem; color: var(--blockquote-text);
            background: var(--blockquote-bg); border-radius: 0 6px 6px 0;
        }
        #content ul, #content ol { padding-left: 1.8rem; margin: 0.8rem 0; }
        #content img { max-width: 100%; border-radius: 6px; }
        #content hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
        #content table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
        #content th, #content td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
        #content th { background: var(--surface-2); border-bottom: 2px solid var(--accent-border); }

        /* ---------- Language Selector ---------- */
        .lang-footer {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            display: none; /* 默认隐藏，如果有语言才显示 */
        }
        .lang-footer.visible {
            display: block;
        }
        .lang-footer-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .lang-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .lang-links a {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text);
            text-decoration: none;
            transition: all 0.15s;
        }
        .lang-links a:hover {
            background: var(--accent-soft);
            border-color: var(--accent-border);
            color: var(--accent);
        }
        .lang-links a.current {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            pointer-events: none;
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 700px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%; height: auto; max-height: 220px;
                position: relative; border-right: none;
                border-bottom: 1px solid var(--border); padding: 1rem;
            }
            .main-content { padding: 1rem; justify-content: flex-start; }
            #content { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 id="toc-title">Table of Contents</h3>
            <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme"></button>
        </div>
        <ul class="toc-list" id="toc-list">
            <li class="toc-placeholder">No headings yet</li>
        </ul>
    </aside>

    <div class="main-content">
        <main id="content">
            <p class="loading">loading...</p>
        </main>
        
        <!-- 语言切换底部 UI -->
        <div class="lang-footer" id="lang-footer">
            <div class="lang-footer-title">Available Languages</div>
            <div class="lang-links" id="lang-links"></div>
        </div>
    </div>

    <script>
        (function() {
            // 1. 解析 URL 参数
            const searchStr = window.location.search;
            const urlParams = {};
            let pageName = 'README';

            if (searchStr.length > 1) {
                const raw = searchStr.substring(1);
                const parts = raw.split('&');
                parts.forEach((part, idx) => {
                    if (idx === 0 && !part.includes('=')) {
                        pageName = decodeURIComponent(part);
                    } else if (part.includes('=')) {
                        const eq = part.indexOf('=');
                        const k = part.slice(0, eq);
                        const v = part.slice(eq + 1);
                        urlParams[decodeURIComponent(k)] = decodeURIComponent(v);
                    }
                });
            }

            const ACCENTS = ['blue', 'red', 'green', 'purple', 'orange', 'pink', 'teal'];

            // 2. 主题逻辑
            const THEME_KEY = 'qd-theme';
            const htmlEl = document.documentElement;
            const themeToggleBtn = document.getElementById('theme-toggle');
            const tocTitleEl = document.getElementById('toc-title');
            const sidebarEl = document.getElementById('sidebar');

            const initThemeColor = urlParams['theme'];
            if (initThemeColor && ACCENTS.includes(initThemeColor)) {
                htmlEl.setAttribute('data-accent', initThemeColor);
            } else {
                htmlEl.setAttribute('data-accent', 'blue');
            }

            function getPreferredTheme() {
                const stored = localStorage.getItem(THEME_KEY);
                if (stored === 'light' || stored === 'dark') return stored;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            function applyTheme(theme) {
                htmlEl.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    themeToggleBtn.innerHTML = '☀️';
                    themeToggleBtn.title = 'Switch to light mode';
                } else {
                    themeToggleBtn.innerHTML = '🌙';
                    themeToggleBtn.title = 'Switch to dark mode';
                }
            }

            let currentTheme = getPreferredTheme();
            applyTheme(currentTheme);

            themeToggleBtn.addEventListener('click', () => {
                currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
                applyTheme(currentTheme);
                localStorage.setItem(THEME_KEY, currentTheme);
            });

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!localStorage.getItem(THEME_KEY)) {
                    currentTheme = e.matches ? 'dark' : 'light';
                    applyTheme(currentTheme);
                }
            });

            document.title = `${pageName} - Quick Documentation`;
            const fetchUrl = `${pageName}.md?t=${new Date().getTime()}`;

            const contentEl = document.getElementById('content');
            const tocListEl = document.getElementById('toc-list');

            // 3. Front-matter 解析
            function parseFrontMatter(text) {
                const meta = {};
                const result = { meta, body: text };
                const trimmed = text.replace(/^\uFEFF/, '').replace(/^\s+/, '');
                if (!trimmed.startsWith('---')) return result;

                const lines = trimmed.split(/\r?\n/);
                if (lines[0].trim() !== '---') return result;

                let endIdx = -1;
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '---') {
                        endIdx = i;
                        break;
                    }
                }
                if (endIdx === -1) return result;

                const metaLines = lines.slice(1, endIdx);
                metaLines.forEach(line => {
                    const m = line.match(/^\s*([A-Za-z0-9_-]+)\s*:\s*(.*)$/);
                    if (m) {
                        let value = m[2].trim();
                        if ((value.startsWith('"') && value.endsWith('"')) ||
                            (value.startsWith("'") && value.endsWith("'"))) {
                            value = value.slice(1, -1);
                        }
                        meta[m[1]] = value;
                    }
                });

                result.body = lines.slice(endIdx + 1).join('\n');
                return result;
            }

            function applyMeta(meta) {
                const theme = urlParams['theme'] || meta['theme'];
                if (theme && ACCENTS.includes(theme)) {
                    htmlEl.setAttribute('data-accent', theme);
                } else {
                    htmlEl.setAttribute('data-accent', 'blue');
                }

                const sidebarTitle = urlParams['sidebar-title'] || meta['sidebar-title'];
                if (sidebarTitle) {
                    tocTitleEl.textContent = sidebarTitle;
                }

                const docTitle = urlParams['doc-title'] || meta['doc-title'];
                document.title = docTitle
                    ? `${docTitle} - Quick Documentation`
                    : `${pageName} - Quick Documentation`;

                const hideToc = urlParams['hide-toc'] || meta['hide-toc'];
                if (hideToc === 'true' || hideToc === '1') {
                    sidebarEl.classList.add('hidden');
                }
            }

            // 4. TOC 逻辑
            function generateTOC() {
                const headings = contentEl.querySelectorAll('h1, h2, h3, h4, h5, h6');
                if (headings.length === 0) {
                    tocListEl.innerHTML = '<li class="toc-placeholder">No headings found</li>';
                    return;
                }

                const tocItems = [];
                headings.forEach((heading, index) => {
                    if (!heading.id) {
                        const text = heading.textContent.trim().toLowerCase()
                            .replace(/[^a-z0-9\s-]/g, '')
                            .replace(/\s+/g, '-')
                            .replace(/-+/g, '-');
                        const baseId = text || `heading-${index}`;
                        let uniqueId = baseId;
                        let counter = 1;
                        while (document.getElementById(uniqueId)) {
                            uniqueId = `${baseId}-${counter}`;
                            counter++;
                        }
                        heading.id = uniqueId;
                    }

                    const level = parseInt(heading.tagName.substring(1));
                    const id = heading.id;
                    const text = heading.textContent.trim();

                    tocItems.push(`
                        <li class="toc-level-${level}">
                            <a href="#${id}" data-target="${id}">${text}</a>
                        </li>
                    `);
                });

                tocListEl.innerHTML = tocItems.join('');

                const tocLinks = tocListEl.querySelectorAll('a');
                tocLinks.forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        const targetId = this.dataset.target;
                        const targetEl = document.getElementById(targetId);
                        if (targetEl) {
                            targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            history.pushState(null, null, `#${targetId}`);
                            tocLinks.forEach(l => l.classList.remove('active'));
                            this.classList.add('active');
                        }
                    });
                });

                setupScrollSpy(headings);
            }

            function setupScrollSpy(headings) {
                if (headings.length === 0) return;
                const tocLinks = tocListEl.querySelectorAll('a');
                const linkMap = new Map();
                tocLinks.forEach(link => linkMap.set(link.dataset.target, link));

                const observerOptions = { root: null, rootMargin: '0px 0px -20% 0px', threshold: 0.1 };
                let activeId = null;

                const observer = new IntersectionObserver((entries) => {
                    const visibleEntries = entries.filter(entry => entry.isIntersecting);
                    if (visibleEntries.length === 0) return;

                    let topEntry = visibleEntries[0];
                    visibleEntries.forEach(entry => {
                        if (entry.boundingClientRect.top < topEntry.boundingClientRect.top) topEntry = entry;
                    });

                    const newActiveId = topEntry.target.id;
                    if (newActiveId !== activeId) {
                        activeId = newActiveId;
                        tocLinks.forEach(link => link.classList.remove('active'));
                        const activeLink = linkMap.get(activeId);
                        if (activeLink) activeLink.classList.add('active');
                    }
                }, observerOptions);

                headings.forEach(heading => observer.observe(heading));
            }

            // ============================================================
            // 5. 语言变种探测与自动提示
            // ============================================================
            async function checkLanguageVariants() {
                // 主页 (README) 忽略多语言探测
                if (pageName.toLowerCase() === 'readme') return;

                // 解析基础文件名和当前后缀
                let baseName = pageName;
                let currentLang = 'en'; // 默认英文
                
                const langRegex = /-(zh|jp|kr)$/i;
                const match = pageName.match(langRegex);
                if (match) {
                    currentLang = match[1].toLowerCase();
                    baseName = pageName.replace(langRegex, '');
                }

                const variants = {
                    'en': { suffix: '', name: 'English' },
                    'zh': { suffix: '-zh', name: '中文' },
                    'jp': { suffix: '-jp', name: '日本語' },
                    'kr': { suffix: '-kr', name: '한국어' }
                };

                const available = [];
                const langKeys = Object.keys(variants);
                
                // 并发探测所有变种文件是否存在 (使用 HEAD 请求，极快)
                const checks = langKeys.map(async (lang) => {
                    const filename = lang === 'en' ? `${baseName}.md` : `${baseName}${variants[lang].suffix}.md`;
                    try {
                        // 加时间戳防缓存，加 ?t= 是为了避免有些服务器缓存 404
                        const res = await fetch(`${filename}?t=${new Date().getTime()}`, { method: 'HEAD' });
                        if (res.ok) available.push({ lang, ...variants[lang], filename });
                    } catch (e) {
                        // 忽略错误
                    }
                });

                await Promise.all(checks);

                if (available.length <= 1) return; // 如果只有当前这一种语言，就不显示

                // 渲染底部 UI
                const footerEl = document.getElementById('lang-footer');
                const linksEl = document.getElementById('lang-links');
                linksEl.innerHTML = '';

                // 按英、中、日、韩排序
                available.sort((a, b) => langKeys.indexOf(a.lang) - langKeys.indexOf(b.lang));

                available.forEach(item => {
                    const a = document.createElement('a');
                    // 构建新的 URL 链接 (保留原有的主题等参数)
                    let newUrl = `?${item.lang === 'en' ? baseName : baseName + item.suffix}`;
                    const queryParams = [];
                    for (const [k, v] of Object.entries(urlParams)) {
                        queryParams.push(`${encodeURIComponent(k)}=${encodeURIComponent(v)}`);
                    }
                    if (queryParams.length > 0) newUrl += `&${queryParams.join('&')}`;

                    a.href = newUrl;
                    a.textContent = item.name;
                    if (item.lang === currentLang) {
                        a.classList.add('current');
                    }
                    linksEl.appendChild(a);
                });

                footerEl.classList.add('visible');

                // 自动弹窗检测逻辑
                const browserLang = (navigator.language || navigator.userLanguage).toLowerCase();
                let preferredLang = 'en';
                if (browserLang.startsWith('zh')) preferredLang = 'zh';
                else if (browserLang.startsWith('ja')) preferredLang = 'jp';
                else if (browserLang.startsWith('ko')) preferredLang = 'kr';

                // 只有当用户的语言与当前语言不一致，且该语言存在变种时，才弹窗
                if (preferredLang !== currentLang) {
                    const targetVariant = available.find(v => v.lang === preferredLang);
                    
                    // 延迟 500ms 弹窗，避免阻塞页面渲染
                    setTimeout(() => {
                        if (targetVariant) {
                            // 有用户的语言变种
                            const confirmSwitch = confirm(`It looks like you prefer ${targetVariant.name}. Would you like to switch to the ${targetVariant.name} version?`);
                            if (confirmSwitch) {
                                window.location.href = `?${baseName}${targetVariant.suffix}`;
                            }
                        } else {
                            // 支持的语言里没有用户的语言，提示切换到英文
                            const confirmEnglish = confirm(`A version in your language is not available. Would you like to switch to the English version?`);
                            if (confirmEnglish) {
                                window.location.href = `?${baseName}`;
                            }
                        }
                    }, 500);
                }
            }

            // 6. 执行加载与渲染
            fetch(fetchUrl)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.text();
                })
                .then(text => {
                    const parsed = parseFrontMatter(text);
                    applyMeta(parsed.meta);
                    contentEl.innerHTML = marked.parse(parsed.body);
                    generateTOC();

                    if (window.MathJax && MathJax.typesetPromise) {
                        MathJax.typesetPromise([contentEl]).catch((err) => console.warn('MathJax error:', err));
                    }

                    // 文档渲染成功后，触发多语言探测
                    checkLanguageVariants();
                })
                .catch(err => {
                    console.error(err);
                    const is404 = err.message.includes('404');
                    contentEl.innerHTML = `
                        <h1 style="color:var(--error); border-bottom-color:var(--error)">Document Not Found</h1>
                        <div class="error-box">
                            <h3>${is404 ? 'HTTP 404 — File could not be loaded' : 'Failed to load'}</h3>
                            <p>
                                ${is404 
                                  ? `The file <strong>${pageName}.md</strong> was not found on this server. If you are the author, make sure the file exists and GitHub Pages (Jekyll) is not ignoring it.` 
                                  : `An unexpected error occurred while fetching the document.`}
                            </p>
                        </div>
                    `;
                    tocListEl.innerHTML = '<li class="toc-placeholder">Content unavailable</li>';
                });
        })();
    </script>
</body>
</html>

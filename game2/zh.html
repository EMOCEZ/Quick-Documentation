<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色擂台赛 · 极简AI对战</title>
<style>
/* ===== 沿用 Quick Documentation 的 CSS 变量与主题体系 ===== */
:root {
    --shadow: rgba(0, 0, 0, 0.04);
    --error: #b91c1c;
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #1e293b;
    --text-muted: #64748b;
    --text-faint: #94a3b8;
    --toc-hover-bg: #f1f5f9;
    --code-bg: rgba(0, 0, 0, 0.05);
    --pre-bg: #1e293b;
    --pre-text: #f8fafc;
    --blockquote-bg: rgba(0, 0, 0, 0.02);
    --blockquote-text: #475569;
}
html[data-theme="dark"] {
    --shadow: rgba(0, 0, 0, 0.3);
    --error: #f87171;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --text-faint: #64748b;
    --toc-hover-bg: rgba(255, 255, 255, 0.05);
    --code-bg: rgba(255, 255, 255, 0.1);
    --pre-bg: #0b1220;
    --pre-text: #e2e8f0;
    --blockquote-bg: rgba(255, 255, 255, 0.03);
    --blockquote-text: #cbd5e1;
}
html[data-accent="blue"] { --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9; --border:#e2e8f0; --border-strong:#cbd5e1; --accent:#2563eb; --accent-hover:#1d4ed8; --accent-soft:#eff6ff; --accent-border:#3b82f6; }
html[data-theme="dark"][data-accent="blue"] { --bg:#0b1120; --surface:#111a2e; --surface-2:#1b263e; --border:#2a3b5c; --accent:#60a5fa; --accent-hover:#93c5fd; --accent-soft:#1e3a5f; --accent-border:#60a5fa; }
html[data-accent="red"] { --bg:#fefafa; --surface:#ffffff; --surface-2:#fef2f2; --border:#fee2e2; --border-strong:#fca5a5; --accent:#dc2626; --accent-hover:#b91c1c; --accent-soft:#fef2f2; --accent-border:#ef4444; }
html[data-theme="dark"][data-accent="red"] { --bg:#140b0b; --surface:#1f1010; --surface-2:#2c1515; --border:#4a2222; --accent:#f87171; --accent-hover:#fca5a5; --accent-soft:#4c1d1d; --accent-border:#f87171; }
html[data-accent="green"] { --bg:#f9fdfa; --surface:#ffffff; --surface-2:#f0fdf4; --border:#dcfce7; --border-strong:#86efac; --accent:#16a34a; --accent-hover:#15803d; --accent-soft:#f0fdf4; --accent-border:#22c55e; }
html[data-theme="dark"][data-accent="green"] { --bg:#0a140e; --surface:#101f15; --surface-2:#182e1f; --border:#264d33; --accent:#4ade80; --accent-hover:#86efac; --accent-soft:#14432a; --accent-border:#4ade80; }
html[data-accent="purple"] { --bg:#fcfbfe; --surface:#ffffff; --surface-2:#f5f3ff; --border:#ede9fe; --border-strong:#c4b5fd; --accent:#7c3aed; --accent-hover:#6d28d9; --accent-soft:#f5f3ff; --accent-border:#8b5cf6; }
html[data-theme="dark"][data-accent="purple"] { --bg:#100a1c; --surface:#181026; --surface-2:#221736; --border:#38265c; --accent:#a78bfa; --accent-hover:#c4b5fd; --accent-soft:#2e1f5e; --accent-border:#a78bfa; }
html[data-accent="orange"] { --bg:#fffaf7; --surface:#ffffff; --surface-2:#fff7ed; --border:#ffedd5; --border-strong:#fdba74; --accent:#ea580c; --accent-hover:#c2410c; --accent-soft:#fff7ed; --accent-border:#f97316; }
html[data-theme="dark"][data-accent="orange"] { --bg:#150d08; --surface:#20140d; --surface-2:#2e1c12; --border:#4a2c1c; --accent:#fb923c; --accent-hover:#fdba74; --accent-soft:#4a2508; --accent-border:#fb923c; }
html[data-accent="pink"] { --bg:#fffbfd; --surface:#ffffff; --surface-2:#fdf2f8; --border:#fce7f3; --border-strong:#f9a8d4; --accent:#db2777; --accent-hover:#be185d; --accent-soft:#fdf2f8; --accent-border:#ec4899; }
html[data-theme="dark"][data-accent="pink"] { --bg:#140a10; --surface:#1f101a; --surface-2:#2e1626; --border:#4a233d; --accent:#f472b6; --accent-hover:#f9a8d4; --accent-soft:#4a1530; --accent-border:#f472b6; }
html[data-accent="teal"] { --bg:#f8fdfc; --surface:#ffffff; --surface-2:#f0fdfa; --border:#ccfbf1; --border-strong:#5eead4; --accent:#0d9488; --accent-hover:#0f766e; --accent-soft:#f0fdfa; --accent-border:#14b8a6; }
html[data-theme="dark"][data-accent="teal"] { --bg:#081413; --surface:#0d1f1e; --surface-2:#142e2d; --border:#1f4a47; --accent:#2dd4bf; --accent-hover:#5eead4; --accent-soft:#0f3d3a; --accent-border:#2dd4bf; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light dark; }
body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    min-height: 100vh;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    transition: background-color 0.25s ease, color 0.25s ease;
    padding: 1.5rem;
}
.wrap { max-width: 1200px; margin: 0 auto; }

.topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap;
}
.topbar h1 { font-size: 1.7rem; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
.topbar .sub { font-size: 0.9rem; color: var(--text-muted); }
.theme-toggle {
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-muted); width: 42px; height: 42px; border-radius: 8px;
    cursor: pointer; font-size: 1.2rem; display: inline-flex;
    align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.theme-toggle:hover { background: var(--toc-hover-bg); color: var(--text); }

.main-grid {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 1.5rem;
    align-items: start;
}
@media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

.arena-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    box-shadow: 0 4px 12px var(--shadow);
}
.arena-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.5rem;
}
.arena-header .title { font-size: 1.05rem; font-weight: 600; }
.arena-header .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }

#mapCanvas {
    width: 100%;
    aspect-ratio: 16 / 10;
    background: var(--surface-2);
    border-radius: 10px;
    border: 2px dashed var(--border-strong);
    position: relative;
    overflow: hidden;
    cursor: crosshair;
    transition: border-color 0.15s;
}
#mapSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#mapSvg .tile { pointer-events: auto; cursor: pointer; transition: opacity 0.15s; }
#mapSvg .tile:hover { opacity: 0.75; }

#unitLayer { position: absolute; inset: 0; pointer-events: none; }
.unit {
    position: absolute;
    pointer-events: auto;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
    transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1), top 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
    width: 56px;
}
.unit-icon {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    border: 2px solid var(--unit-color, var(--accent));
    background: var(--surface);
    box-shadow: 0 2px 8px var(--shadow);
    transition: transform 0.15s, box-shadow 0.15s;
}
.unit.active .unit-icon {
    box-shadow: 0 0 0 3px var(--accent-border), 0 4px 16px var(--shadow);
    transform: scale(1.1);
}
.unit.dead { opacity: 0.35; filter: grayscale(0.8); }
.unit-hp {
    width: 48px; height: 5px; background: var(--surface-2);
    border-radius: 999px; margin-top: 3px; overflow: hidden;
    border: 1px solid var(--border);
}
.unit-hp-fill {
    height: 100%; width: 100%; background: var(--unit-color, var(--accent));
    border-radius: 999px; transition: width 0.35s ease;
}

@keyframes unitMove {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.12); }
    100% { transform: translate(-50%, -50%) scale(1); }
}
.unit.moving .unit-icon { animation: unitMove 0.4s ease; }
@keyframes attackLunge {
    0% { transform: translate(-50%, -50%) scale(1); }
    40% { transform: translate(-50%, -50%) scale(1.25) rotate(-8deg); }
    100% { transform: translate(-50%, -50%) scale(1); }
}
.unit.attacking .unit-icon { animation: attackLunge 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes hitShake {
    0%, 100% { transform: translate(-50%, -50%); }
    20% { transform: translate(calc(-50% - 6px), -50%); }
    40% { transform: translate(calc(-50% + 6px), -50%); }
    60% { transform: translate(calc(-50% - 4px), -50%); }
    80% { transform: translate(calc(-50% + 4px), -50%); }
}
.unit.hit { animation: hitShake 0.4s ease; }
@keyframes healGlow {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
    50% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}
.unit.healing .unit-icon { animation: healGlow 0.8s ease; border-color: #22c55e; }
@keyframes buffGlow {
    0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.6); }
    50% { box-shadow: 0 0 0 12px rgba(234, 179, 8, 0); }
    100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
}
.unit.buffing .unit-icon { animation: buffGlow 0.8s ease; border-color: #eab308; }
@keyframes deathFade {
    0% { opacity: 1; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) rotate(180deg) scale(0.3); }
}
.unit.dying { animation: deathFade 0.6s ease forwards; }

.damage-float {
    position: absolute;
    pointer-events: none;
    font-weight: 800;
    font-size: 1.1rem;
    z-index: 100;
    animation: floatUp 0.9s ease-out forwards;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    transform: translate(-50%, -50%);
}
.damage-float.crit { font-size: 1.4rem; color: #f59e0b; }
.damage-float.normal { color: #ef4444; }
.damage-float.heal { color: #22c55e; }
@keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
    30% { opacity: 1; transform: translate(-50%, -80%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -160%) scale(0.9); }
}

.control-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    box-shadow: 0 4px 12px var(--shadow);
    display: flex; flex-direction: column; gap: 1rem;
}
.control-panel h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.25rem; }

button {
    font-family: inherit; cursor: pointer; border-radius: 8px;
    font-weight: 600; transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s, box-shadow 0.15s;
    border: none;
}
button:active:not(:disabled) { transform: scale(0.97); }
button:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
.btn-primary {
    background: var(--accent); color: #fff; padding: 0.75rem 1.5rem;
    font-size: 1rem; box-shadow: 0 4px 12px var(--shadow);
}
.btn-primary:hover { background: var(--accent-hover); box-shadow: 0 6px 18px var(--shadow); }
.btn-ghost {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong);
    padding: 0.6rem 1rem; font-size: 0.9rem;
}
.btn-ghost:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
.btn-small { padding: 0.35rem 0.7rem; font-size: 0.8rem; }
.btn-danger { color: var(--error); border-color: var(--error); }
.btn-danger:hover { background: rgba(185,28,28,0.08); color: var(--error); }

.team-editor {
    display: flex; flex-direction: column; gap: 0.6rem;
    max-height: 420px; overflow-y: auto; padding-right: 4px;
}
.team-editor::-webkit-scrollbar { width: 6px; }
.team-editor::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
.fighter-edit-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.7rem;
    display: flex; flex-direction: column; gap: 0.4rem;
    position: relative;
}
.fighter-edit-card .fe-head {
    display: flex; align-items: center; gap: 0.4rem;
}
.fighter-edit-card .fe-icon-btn {
    width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: 1rem;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
.fighter-edit-card .fe-name {
    flex: 1; min-width: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; padding: 0.3rem 0.5rem; font-size: 0.88rem;
    font-family: inherit; color: var(--text);
}
.fighter-edit-card .fe-color {
    width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); cursor: pointer; padding: 0; flex-shrink: 0;
}
.fighter-edit-card .fe-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.3rem;
}
.fighter-edit-card .fe-stat {
    display: flex; flex-direction: column; gap: 0.1rem;
}
.fighter-edit-card .fe-stat label {
    font-size: 0.7rem; color: var(--text-muted); font-weight: 600;
}
.fighter-edit-card .fe-stat input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 0.25rem 0.35rem; font-size: 0.82rem;
    font-family: inherit; color: var(--text);
}
.fighter-edit-card .fe-skills {
    display: flex; flex-direction: column; gap: 0.3rem;
}
.fighter-edit-card .fe-skill-row {
    display: flex; align-items: center; gap: 0.3rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; padding: 0.25rem 0.4rem; font-size: 0.78rem;
}
.fighter-edit-card .fe-skill-row .sk-name {
    flex: 1; min-width: 0; background: transparent; border: none;
    font-family: inherit; color: var(--text); font-size: 0.8rem; padding: 0.1rem;
}
.fighter-edit-card .fe-skill-row .sk-type {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 4px; font-size: 0.72rem; padding: 0.1rem 0.2rem;
    font-family: inherit; color: var(--text-muted);
}
.fighter-edit-card .fe-skill-row .sk-num {
    width: 48px; background: transparent; border: 1px solid var(--border);
    border-radius: 4px; padding: 0.1rem 0.2rem; font-size: 0.75rem;
    font-family: inherit; color: var(--text); text-align: right;
}
.fighter-edit-card .fe-skill-row .sk-del {
    background: transparent; border: none; color: var(--text-faint);
    cursor: pointer; font-size: 0.9rem; padding: 0 0.2rem; line-height: 1;
}
.fighter-edit-card .fe-skill-row .sk-del:hover { color: var(--error); }
.fighter-edit-card .fe-actions {
    display: flex; gap: 0.3rem; justify-content: flex-end;
}
.fighter-edit-card .fe-actions button {
    font-size: 0.72rem; padding: 0.2rem 0.5rem;
}
.team-editor-empty {
    text-align: center; color: var(--text-faint); font-style: italic;
    font-size: 0.85rem; padding: 1rem;
}
.section-tabs {
    display: flex; gap: 0.3rem; margin-bottom: 0.5rem;
}
.section-tabs button {
    flex: 1; padding: 0.4rem; font-size: 0.82rem; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--text-muted);
}
.section-tabs button.active {
    background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border);
}

.log-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    box-shadow: 0 4px 12px var(--shadow);
    margin-top: 1rem;
    display: flex;
    flex-direction: column;
    height: 260px;
    overflow: hidden;
}
.log-title {
    font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.5px; font-weight: 600; margin-bottom: 0.4rem;
    flex-shrink: 0;
}
.log-list {
    flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 0.1rem;
}
.log-line {
    padding: 0.3rem 0.5rem; border-radius: 6px; font-size: 0.88rem;
    border-left: 3px solid transparent;
    animation: slideIn 0.3s ease;
    flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.log-line .round-tag { font-weight: 700; color: var(--accent); margin-right: 0.3rem; font-size: 0.78rem; }
.log-line.dmg { border-left-color: var(--error); background: rgba(185, 28, 28, 0.05); }
.log-line.crit { border-left-color: #d97706; background: rgba(217, 119, 6, 0.08); font-weight: 600; }
.log-line.heal { border-left-color: #16a34a; background: rgba(22, 163, 74, 0.06); }
.log-line.info { border-left-color: var(--accent-border); background: var(--accent-soft); }
.log-line.end { border-left-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.log-empty { color: var(--text-faint); font-style: italic; font-size: 0.9rem; padding: 0.4rem; flex-shrink: 0; }

.legend { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
.legend-item { display: flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; color: var(--text-muted); }
.legend-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); }
.hint { font-size: 0.8rem; color: var(--text-faint); margin-top: 0.25rem; }

.loading { color: var(--text-muted); font-style: italic; padding: 2rem; text-align: center; }
.error-box {
    background: var(--surface-2); border: 1px solid var(--border-strong);
    border-left: 4px solid var(--error); border-radius: 6px;
    padding: 1rem 1.25rem; margin: 1rem 0;
}
.error-box h3 { color: var(--error); margin-bottom: 0.4rem; font-size: 1.05rem; }
.error-box p { color: var(--text-muted); font-size: 0.92rem; }
</style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div>
            <h1 id="gameTitle">⚔️ 角色擂台赛 · 极简AI</h1>
            <div class="sub" id="gameSub">JSON 驱动 · BFS寻路 · 队伍编辑器 · 自动对战</div>
        </div>
        <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
    </div>
    <div id="app">
        <p class="loading">正在加载 main.json ...</p>
    </div>
</div>

<script>
(function() {
'use strict';

/* ===== 主题 ===== */
const THEME_KEY = 'qd-theme';
const ACCENTS = ['blue', 'red', 'green', 'purple', 'orange', 'pink', 'teal'];
const htmlEl = document.documentElement;
const themeBtn = document.getElementById('themeToggle');
function getPreferredTheme() {
    const s = localStorage.getItem(THEME_KEY);
    if (s === 'light' || s === 'dark') return s;
    return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(t) {
    htmlEl.setAttribute('data-theme', t);
    themeBtn.innerHTML = t === 'dark' ? '☀️' : '🌙';
}
let curTheme = getPreferredTheme();
applyTheme(curTheme);
if (!htmlEl.getAttribute('data-accent')) htmlEl.setAttribute('data-accent', 'blue');
themeBtn.addEventListener('click', () => {
    curTheme = curTheme === 'dark' ? 'light' : 'dark';
    applyTheme(curTheme);
    localStorage.setItem(THEME_KEY, curTheme);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem(THEME_KEY)) { curTheme = e.matches ? 'dark' : 'light'; applyTheme(curTheme); }
});

/* ===== 工具 ===== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
function escapeHTML(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

/* ===== 默认配置 ===== */
const DEFAULT_CONFIG = {
    title: '⚔️ 角色擂台赛 · 极简AI',
    subtitle: 'JSON 驱动 · BFS寻路 · 队伍编辑器 · 自动对战',
    accent: 'blue', speed: 1, mapWidth: 16, mapHeight: 10,

function mergeConfig(base, over) {
    const out = deepClone(base);
    if (!over || typeof over !== 'object') return out;
    for (const k of Object.keys(over)) {
        if (k === 'fighters' && Array.isArray(over.fighters)) out.fighters = over.fighters;
        else if (k === 'map') out.map = over.map;
        else out[k] = over[k];
    }
    out.fighters = (out.fighters || []).filter(f => f && f.name).map((f, i) => ({
        id: f.id || ('f' + i),
        name: f.name || ('角色' + (i + 1)),
        icon: f.icon || '⚔️',
        color: f.color || '#2563eb',
        team: f.team === 'red' ? 'red' : 'blue',
        hp: Math.max(1, parseInt(f.hp) || 100),
        atk: Math.max(1, parseInt(f.atk) || 15),
        def: Math.max(0, parseInt(f.def) || 5),
        spd: Math.max(1, parseInt(f.spd) || 10),
        skills: Array.isArray(f.skills) && f.skills.length ? f.skills : [{ name: '普通攻击', type: 'attack', mult: 1.0 }]
    }));
    if (out.fighters.length < 2) {
        const defaults = DEFAULT_CONFIG.fighters;
        while (out.fighters.length < 2) {
            const d = deepClone(defaults[out.fighters.length] || defaults[0]);
            d.id = 'auto_' + out.fighters.length;
            out.fighters.push(d);
        }
    }
    return out;
}

/* ===== 地图 ===== */
function generateDefaultMap(w, h) {
    const grid = [];
    for (let y = 0; y < h; y++) {
        const row = [];
        for (let x = 0; x < w; x++) row.push(null);
        grid.push(row);
    }
    return { grid, width: w, height: h };
}

function colorToEffect(color) {
    if (!color) return { type: 'empty', passable: true, speedMod: 1.0 };
    const c = color.toLowerCase();
    if (c === '#60a5fa' || c === 'blue' || c === '#3b82f6') return { type: 'water', passable: false, speedMod: 0 };
    if (c === '#22c55e' || c === 'green' || c === '#16a34a') return { type: 'grass', passable: true, speedMod: 1.5 };
    if (c === '#ef4444' || c === 'red' || c === '#dc2626') return { type: 'lava', passable: true, speedMod: 0.6 };
    return { type: 'empty', passable: true, speedMod: 1.0 };
}

function renderMap() {
    const svg = $('#mapSvg');
    if (!svg) return;
    const w = mapData.width, h = mapData.height;
    const cellSize = 48;
    svg.setAttribute('viewBox', `0 0 ${w * cellSize} ${h * cellSize}`);
    let html = '';
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const color = mapData.grid[y][x];
            const effect = colorToEffect(color);
            const fill = color || 'transparent';
            const stroke = color ? 'rgba(0,0,0,0.1)' : 'var(--border)';
            const strokeDash = color ? 'none' : '4 4';
            html += `<rect class="tile" x="${x * cellSize}" y="${y * cellSize}" width="${cellSize}" height="${cellSize}" fill="${fill}" stroke="${stroke}" stroke-dasharray="${strokeDash}" data-x="${x}" data-y="${y}" />`;
            if (effect.type === 'water') html += `<text x="${x*cellSize+24}" y="${y*cellSize+30}" text-anchor="middle" font-size="20" fill="rgba(255,255,255,0.8)" pointer-events="none">🌊</text>`;
            else if (effect.type === 'grass') html += `<text x="${x*cellSize+24}" y="${y*cellSize+30}" text-anchor="middle" font-size="20" fill="rgba(255,255,255,0.8)" pointer-events="none">🌿</text>`;
            else if (effect.type === 'lava') html += `<text x="${x*cellSize+24}" y="${y*cellSize+30}" text-anchor="middle" font-size="20" fill="rgba(255,255,255,0.8)" pointer-events="none">🔥</text>`;
        }
    }
    svg.innerHTML = html;
    $$('.tile', svg).forEach(tile => {
        tile.addEventListener('click', e => {
            e.stopPropagation();
            const x = parseInt(tile.dataset.x), y = parseInt(tile.dataset.y);
            mapData.grid[y][x] = getNextColor(mapData.grid[y][x]);
            renderMap();
        });
    });
}

function getNextColor(current) {
    if (!current) return '#60a5fa';
    const c = current.toLowerCase();
    if (c === '#60a5fa') return '#22c55e';
    if (c === '#22c55e') return '#ef4444';
    if (c === '#ef4444') return null;
    return '#60a5fa';
}

/* ===== 角色 ===== */
function makeFighter(src, index) {
    return {
        id: src.id, name: src.name, icon: src.icon, color: src.color, team: src.team,
        maxHp: src.hp, hp: src.hp, atk: src.atk, def: src.def, spd: src.spd,
        skills: deepClone(src.skills),
        alive: true, poison: 0, defBuff: 0,
        x: 0, y: 0, index
    };
}

function assignInitialPositions() {
    const blue = fighters.filter(f => f.team === 'blue');
    const red = fighters.filter(f => f.team === 'red');
    blue.forEach((f, i) => {
        const pos = findSpawnPos('left', i);
        f.x = pos.x; f.y = pos.y;
    });
    red.forEach((f, i) => {
        const pos = findSpawnPos('right', i);
        f.x = pos.x; f.y = pos.y;
    });
}

function findSpawnPos(side, index) {
    const w = mapData.width, h = mapData.height;
    const results = [];
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            if (colorToEffect(mapData.grid[y][x]).passable) {
                if (!fighters.some(o => o.x === x && o.y === y)) results.push({ x, y });
            }
        }
    }
    if (results.length === 0) return { x: side === 'left' ? 0 : w - 1, y: Math.floor(h / 2) };
    results.sort((a, b) => side === 'left' ? a.x - b.x : b.x - a.x);
    return results[Math.min(index, results.length - 1)];
}

function renderUnits() {
    const layer = $('#unitLayer');
    if (!layer) return;
    const w = mapData.width, h = mapData.height;
    layer.innerHTML = '';
    fighters.forEach((f, idx) => {
        if (!f.alive) return;
        const cellW = 100 / w, cellH = 100 / h;
        const el = document.createElement('div');
        el.className = 'unit';
        el.id = 'unit-' + idx;
        el.style.left = ((f.x + 0.5) * cellW) + '%';
        el.style.top = ((f.y + 0.5) * cellH) + '%';
        el.style.setProperty('--unit-color', f.color);
        el.innerHTML = `
            <div class="unit-icon">${escapeHTML(f.icon)}</div>
            <div class="unit-hp"><div class="unit-hp-fill" style="width:${clamp(f.hp/f.maxHp*100,0,100)}%"></div></div>
        `;
        el.title = `${f.name} (HP: ${f.hp}/${f.maxHp})`;
        layer.appendChild(el);
    });
    highlightActiveUnit();
}

function updateUnitPosition(idx, animate = true) {
    const f = fighters[idx];
    const el = $('#unit-' + idx);
    if (!el || !f) return;
    const w = mapData.width, h = mapData.height;
    const cellW = 100 / w, cellH = 100 / h;
    if (animate) {
        el.classList.add('moving');
        setTimeout(() => el.classList.remove('moving'), 450);
    }
    el.style.left = ((f.x + 0.5) * cellW) + '%';
    el.style.top = ((f.y + 0.5) * cellH) + '%';

    if (hpFill) hpFill.style.width = clamp(f.hp / f.maxHp * 100, 0, 100) + '%';

}

function highlightActiveUnit() {
    $$('.unit').forEach(el => el.classList.remove('active'));
    if (!running || finished) return;
    const activeIdx = getActiveFighterIndex();
    if (activeIdx >= 0) {
        const el = $('#unit-' + activeIdx);

/* ===== 动画 ===== */

function showDamageFloat(idx, text, type) {

    div.style.top = (rect.top - canvasRect.top) + 'px';
    canvas.appendChild(div);
    setTimeout(() => div.remove(), 950);
}
function playDeathAnim(idx) {
    const el = $('#unit-' + idx);
    if (!el) return;
    el.classList.add('dying');
    setTimeout(() => { el.style.display = 'none'; el.classList.remove('dying'); }, 650);

/* ===== BFS 寻路 ===== */
function bfsPath(start, goal, occupied) {
    const w = mapData.width, h = mapData.height;
    if (start.x === goal.x && start.y === goal.y) return [start];
    const visited = new Set();
    visited.add(start.x + ',' + start.y);
    const queue = [{ x: start.x, y: start.y, path: [start] }];
    const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
    while (queue.length > 0) {
        const cur = queue.shift();
        for (const [dx, dy] of dirs) {
            const nx = cur.x + dx, ny = cur.y + dy;
            const key = nx + ',' + ny;
            if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;
            if (visited.has(key)) continue;
            visited.add(key);
            if (!colorToEffect(mapData.grid[ny][nx]).passable) continue;
            if (occupied.has(key) && !(nx === goal.x && ny === goal.y)) continue;
            const newPath = cur.path.concat([{ x: nx, y: ny }]);
            if (nx === goal.x && ny === goal.y) return newPath;
            queue.push({ x: nx, y: ny, path: newPath });
        }
    }
    return null;
}

function findMoveTarget(fighter, target) {
    if (Math.abs(fighter.x - target.x) + Math.abs(fighter.y - target.y) <= 1) {
        return { x: fighter.x, y: fighter.y, adjacent: true };
    }
    const occupied = new Set();
    fighters.forEach(f => { if (f !== fighter && f.alive) occupied.add(f.x + ',' + f.y); });
    const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
    const goals = [];
    for (const [dx, dy] of dirs) {
        const gx = target.x + dx, gy = target.y + dy;
        if (gx < 0 || gx >= mapData.width || gy < 0 || gy >= mapData.height) continue;
        if (!colorToEffect(mapData.grid[gy][gx]).passable) continue;
        goals.push({ x: gx, y: gy });
    }
    let bestPath = null;
    for (const goal of goals) {
        const path = bfsPath(fighter, goal, occupied);
        if (path && (!bestPath || path.length < bestPath.length)) bestPath = path;
    }
    if (!bestPath || bestPath.length < 2) {
        const movable = [];
        for (const [dx, dy] of dirs) {
            const nx = fighter.x + dx, ny = fighter.y + dy;
            if (nx < 0 || nx >= mapData.width || ny < 0 || ny >= mapData.height) continue;
            if (!colorToEffect(mapData.grid[ny][nx]).passable) continue;
            if (occupied.has(nx + ',' + ny)) continue;
            movable.push({ x: nx, y: ny });
        }
        if (movable.length > 0) { const p = pick(movable); return { x: p.x, y: p.y, adjacent: false }; }
        return { x: fighter.x, y: fighter.y, adjacent: false };
    }
    const next = bestPath[1];
    return { x: next.x, y: next.y, adjacent: false };
}

/* ===== 战斗 ===== */
function getActiveFighterIndex() {
    const alive = fighters.map((f, i) => f.alive ? i : -1).filter(i => i >= 0);
    if (alive.length === 0) return -1;
    return alive[round % alive.length];
}

function calcDamage(attacker, defender, skill) {
    const mult = skill.mult || 1.0;
    const def = defender.def * (1 + (defender.defBuff || 0));
    let base = Math.max(1, attacker.atk * mult - def * 0.6);
    base *= 0.9 + Math.random() * 0.2;
    let crit = false;
    if (skill.crit && Math.random() < skill.crit) { base *= 1.8; crit = true; }
    return { dmg: Math.max(1, Math.round(base)), crit };
}

function chooseSkill(f, target) {
    const healSkills = f.skills.filter(s => s.type === 'heal');
    if (f.hp / f.maxHp < 0.35 && healSkills.length && Math.random() < 0.6) return pick(healSkills);
    const offensive = f.skills.filter(s => s.type !== 'heal');
    if (offensive.length) return pick(offensive);
    return f.skills[0];
}

async function takeTurn() {
    if (finished || !running) return;
    const activeIdx = getActiveFighterIndex();
    if (activeIdx < 0) { endBattle(); return; }
    const attacker = fighters[activeIdx];
    const enemies = fighters.filter(f => f.alive && f.team !== attacker.team);
    if (enemies.length === 0) { endBattle(); return; }

    let target = enemies[0], minDist = Infinity;
    enemies.forEach(e => {
        const d = Math.abs(e.x - attacker.x) + Math.abs(e.y - attacker.y);
        if (d < minDist) { minDist = d; target = e; }
    });
    const targetIdx = fighters.indexOf(target);
    const roundNo = Math.floor(round / 2) + 1;

    const move = findMoveTarget(attacker, target);
    if (move.x !== attacker.x || move.y !== attacker.y) {
        attacker.x = move.x; attacker.y = move.y;
        updateUnitPosition(activeIdx, true);
        const effect = colorToEffect(mapData.grid[attacker.y][attacker.x]);
        if (effect.type !== 'empty') {
            addLog(`<span class="round-tag">回合 ${roundNo}</span>🚶 ${escapeHTML(attacker.name)} 移动到${effect.type === 'grass' ? '草地' : '岩浆'} (${attacker.x},${attacker.y})`, 'info');
        }
        await sleep(420 / speed);
    }

    const dist = Math.abs(attacker.x - target.x) + Math.abs(attacker.y - target.y);

    if (dist <= 1) {
        const skill = chooseSkill(attacker, target);
        if (skill.type === 'heal') {
            playAnim(activeIdx, 'healing', 850);
            const heal = Math.max(1, Math.round(skill.amount || 20));
            const before = attacker.hp;
            attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
            const real = attacker.hp - before;
            showDamageFloat(activeIdx, '+' + real, 'heal');
            addLog(`<span class="round-tag">回合 ${roundNo}</span>💚 ${escapeHTML(attacker.name)} 使用【${escapeHTML(skill.name)}】恢复 <b>${real}</b> 点生命`, 'heal');
            updateUnitPosition(activeIdx, false);
            await sleep(700 / speed);
        } else if (skill.type === 'buff') {
            playAnim(activeIdx, 'buffing', 850);
            attacker.defBuff = skill.defUp || 0.5;
            addLog(`<span class="round-tag">回合 ${roundNo}</span>✨ ${escapeHTML(attacker.name)} 使用【${escapeHTML(skill.name)}】防御提升`, 'info');
            await sleep(700 / speed);
        } else {
            playAnim(activeIdx, 'attacking', 500);
            await sleep(280 / speed);
            const { dmg, crit } = calcDamage(attacker, target, skill);
            target.hp -= dmg;
            playAnim(targetIdx, 'hit', 450);
            showDamageFloat(targetIdx, '-' + dmg, crit ? 'crit' : 'normal');
            addLog(`<span class="round-tag">回合 ${roundNo}</span>⚔️ ${escapeHTML(attacker.name)} 使用【${escapeHTML(skill.name)}】对 ${escapeHTML(target.name)} 造成 <b>${dmg}</b> 点伤害${crit ? ' 💥暴击' : ''}`, crit ? 'crit' : 'dmg');
            if (skill.poison) {
                target.poison = 3;
                addLog(`  ☠️ ${escapeHTML(target.name)} 中毒了（3回合）`, 'info');
            }
            updateUnitPosition(targetIdx, false);
            if (target.hp <= 0) {
                target.hp = 0; target.alive = false;
                playDeathAnim(targetIdx);
                addLog(`💀 ${escapeHTML(target.name)} 倒下了！`, 'end');
                await sleep(700 / speed);
                if (fighters.filter(f => f.alive && f.team === 'blue').length === 0 ||
                    fighters.filter(f => f.alive && f.team === 'red').length === 0) {
                    endBattle(); return;
                }
            }
            await sleep(300 / speed);
        }
    } else {
        addLog(`<span class="round-tag">回合 ${roundNo}</span>🏃 ${escapeHTML(attacker.name)} 向 ${escapeHTML(target.name)} 移动`, 'info');
    }

    if (attacker.poison > 0) {
        const pdmg = Math.max(1, Math.round(attacker.maxHp * 0.04));
        attacker.hp -= pdmg;
        playAnim(activeIdx, 'hit', 400);
        showDamageFloat(activeIdx, '-' + pdmg, 'normal');
        addLog(`  ☠️ ${escapeHTML(attacker.name)} 受到中毒伤害 <b>${pdmg}</b> 点`, 'dmg');
        attacker.poison--;
        if (attacker.hp <= 0) {
            attacker.hp = 0; attacker.alive = false;
            playDeathAnim(activeIdx);
            addLog(`💀 ${escapeHTML(attacker.name)} 倒下了！`, 'end');
        }
        updateUnitPosition(activeIdx, false);
    }

    round++;
    highlightActiveUnit();

    if (fighters.filter(f => f.alive && f.team === 'blue').length === 0 ||
        fighters.filter(f => f.alive && f.team === 'red').length === 0) {
        endBattle(); return;
    }

    scheduleNext(550);
}

function scheduleNext(delay) {
    if (!running || finished) return;
    clearTimeout(battleTimer);
    battleTimer = setTimeout(() => {
        if (running && !finished) takeTurn();
    }, delay / speed);
}

function endBattle() {
    if (finished) return;
    finished = true;
    running = false;
    clearTimeout(battleTimer);
    highlightActiveUnit();
    const blueAlive = fighters.filter(f => f.alive && f.team === 'blue').length;
    const redAlive = fighters.filter(f => f.alive && f.team === 'red').length;
    let resultText = '';
    if (blueAlive > 0 && redAlive === 0) { resultText = '🏆 蓝队胜利！'; addLog(`🏆 蓝队获得最终胜利！`, 'end'); }
    else if (redAlive > 0 && blueAlive === 0) { resultText = '🏆 红队胜利！'; addLog(`🏆 红队获得最终胜利！`, 'end'); }
    else { resultText = '🤝 平局！'; addLog(`🤝 双方同归于尽，平局！`, 'end'); }

    const panel = $('.control-panel');
    if (panel) {
        const banner = document.createElement('div');
        banner.id = 'resultBanner';
        banner.style.cssText = 'padding:0.8rem; border-radius:8px; text-align:center; font-weight:700; font-size:1.05rem; background:var(--accent-soft); border:1px solid var(--accent-border); color:var(--accent); margin-top:0.5rem;';
        banner.textContent = resultText;
        panel.appendChild(banner);
    }
    $('#startBtn').disabled = false;
    $('#resetBtn').disabled = false;
}

/* ===== 队伍编辑器 ===== */
function renderTeamEditor() {
    const editor = $('#teamEditor');
    if (!editor) return;
    const teamFighters = fighters.filter(f => f.team === selectedTeam);
    if (teamFighters.length === 0) {
        editor.innerHTML = '<div class="team-editor-empty">该队伍暂无角色</div>';
        return;
    }
    editor.innerHTML = '';
    teamFighters.forEach(f => {
        const idx = fighters.indexOf(f);
        const card = document.createElement('div');
        card.className = 'fighter-edit-card';
        card.innerHTML = `
            <div class="fe-head">
                <button class="fe-icon-btn" data-act="icon" data-idx="${idx}" title="更换图标">${escapeHTML(f.icon)}</button>
                <input class="fe-name" data-idx="${idx}" value="${escapeHTML(f.name)}" placeholder="角色名字" />
                <input class="fe-color" type="color" data-idx="${idx}" value="${f.color}" title="角色颜色" />
            </div>
            <div class="fe-stats">
                <div class="fe-stat"><label>HP</label><input type="number" min="1" data-stat="hp" data-idx="${idx}" value="${f.maxHp}" /></div>
                <div class="fe-stat"><label>ATK</label><input type="number" min="1" data-stat="atk" data-idx="${idx}" value="${f.atk}" /></div>
                <div class="fe-stat"><label>DEF</label><input type="number" min="0" data-stat="def" data-idx="${idx}" value="${f.def}" /></div>
                <div class="fe-stat"><label>SPD</label><input type="number" min="1" data-stat="spd" data-idx="${idx}" value="${f.spd}" /></div>
            </div>
            <div class="fe-skills">
                ${f.skills.map((s, si) => `
                    <div class="fe-skill-row">
                        <input class="sk-name" data-idx="${idx}" data-skidx="${si}" value="${escapeHTML(s.name)}" />
                        <select class="sk-type" data-idx="${idx}" data-skidx="${si}">
                            <option value="attack" ${s.type === 'attack' ? 'selected' : ''}>攻击</option>
                            <option value="heal" ${s.type === 'heal' ? 'selected' : ''}>治疗</option>
                            <option value="buff" ${s.type === 'buff' ? 'selected' : ''}>增益</option>
                        </select>
                        <input class="sk-num" type="number" step="0.05" min="0" data-idx="${idx}" data-skidx="${si}" data-skfield="mult" value="${s.mult != null ? s.mult : (s.amount || s.defUp || 1)}" title="${s.type === 'heal' ? '治疗量' : s.type === 'buff' ? '防御提升' : '攻击倍率'}" />
                        <button class="sk-del" data-act="delskill" data-idx="${idx}" data-skidx="${si}" title="删除技能">×</button>
                    </div>
                `).join('')}
            </div>
            <div class="fe-actions">
                <button class="btn-ghost btn-small" data-act="addskill" data-idx="${idx}">+ 技能</button>
                <button class="btn-ghost btn-small btn-danger" data-act="delete" data-idx="${idx}">删除角色</button>
            </div>
        `;
        editor.appendChild(card);
    });

    editor.querySelectorAll('[data-idx]').forEach(el => {
        const idx = parseInt(el.dataset.idx);
        const f = fighters[idx];
        if (!f) return;

        if (el.classList.contains('fe-name')) {
            el.addEventListener('input', () => { f.name = el.value || '角色'; });
        } else if (el.classList.contains('fe-color')) {
            el.addEventListener('input', () => { f.color = el.value; renderUnits(); });
        } else if (el.dataset.stat) {
            el.addEventListener('input', () => {
                const v = Math.max(1, parseInt(el.value) || 1);
                if (el.dataset.stat === 'hp') { f.maxHp = v; f.hp = Math.min(f.hp, v); }
                else if (el.dataset.stat === 'atk') f.atk = v;
                else if (el.dataset.stat === 'def') f.def = v;
                else if (el.dataset.stat === 'spd') f.spd = v;
                updateUnitPosition(idx, false);
            });
        } else if (el.dataset.skidx != null) {
            const si = parseInt(el.dataset.skidx);
            const skill = f.skills[si];
            if (!skill) return;
            if (el.classList.contains('sk-name')) {
                el.addEventListener('input', () => { skill.name = el.value || '技能'; });
            } else if (el.classList.contains('sk-type')) {
                el.addEventListener('change', () => { skill.type = el.value; renderTeamEditor(); });
            } else if (el.dataset.skfield === 'mult') {
                el.addEventListener('input', () => {
                    const v = parseFloat(el.value) || 1;
                    if (skill.type === 'heal') skill.amount = v;
                    else if (skill.type === 'buff') skill.defUp = v;
                    else skill.mult = v;
                });
            }
        }
    });

    // 按钮事件
    editor.querySelectorAll('[data-act]').forEach(btn => {
        btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.idx);
            const f = fighters[idx];
            if (!f) return;
            const act = btn.dataset.act;
            if (act === 'icon') {
                const newIcon = prompt('输入新的图标（emoji）:', f.icon);
                if (newIcon) { f.icon = newIcon; renderTeamEditor(); renderUnits(); }
            } else if (act === 'delete') {
                if (confirm(`确定删除角色「${f.name}」吗？`)) {
                    fighters = fighters.filter((_, i) => i !== idx);
                    syncConfigFromFighters();
                    renderTeamEditor();
                    renderUnits();
                    if (fighters.filter(x => x.alive).length < 2) resetBattle();
                }
            } else if (act === 'addskill') {
                f.skills.push({ name: '新技能', type: 'attack', mult: 1.0 });
                renderTeamEditor();
            } else if (act === 'delskill') {
                const si = parseInt(btn.dataset.skidx);
                if (isNaN(si) || !f.skills[si]) return;
                f.skills.splice(si, 1);
                if (f.skills.length === 0) f.skills.push({ name: '普通攻击', type: 'attack', mult: 1.0 });
                renderTeamEditor();
            }
        });
    });
}

function syncConfigFromFighters() {
    config.fighters = fighters.map(f => ({
        id: f.id, name: f.name, icon: f.icon, color: f.color, team: f.team,
        hp: f.maxHp, atk: f.atk, def: f.def, spd: f.spd,
        skills: deepClone(f.skills)
    }));
}

/* ===== 控制绑定 ===== */
function bindControls() {
    $('#startBtn').addEventListener('click', () => {
        if (running) return;
        if (finished) resetBattle();
        if (fighters.filter(f => f.alive).length < 2) { alert('存活角色不足，无法开始对战。'); return; }
        running = true;
        finished = false;
        round = 0;
        clearLog();
        fighters.forEach(f => { f.poison = 0; f.defBuff = 0; });
        addLog('⚔️ 对战开始！', 'end');
        $('#startBtn').disabled = true;
        highlightActiveUnit();
        scheduleNext(300);
    });

    $('#resetBtn').addEventListener('click', resetBattle);
    $('#speedSel').addEventListener('change', e => { speed = parseFloat(e.target.value) || 1; });

    $('#tabBlue').addEventListener('click', () => {
        selectedTeam = 'blue';
        $('#tabBlue').classList.add('active');
        $('#tabRed').classList.remove('active');
        renderTeamEditor();
    });
    $('#tabRed').addEventListener('click', () => {
        selectedTeam = 'red';
        $('#tabRed').classList.add('active');
        $('#tabBlue').classList.remove('active');
        renderTeamEditor();
    });

    $('#addFighterBtn').addEventListener('click', () => {
        const newFighter = {
            id: 'custom_' + Date.now(),
            name: '新角色',
            icon: '⚔️',
            color: selectedTeam === 'blue' ? '#2563eb' : '#dc2626',
            team: selectedTeam,
            maxHp: 100, hp: 100, atk: 15, def: 8, spd: 10,
            skills: [{ name: '攻击', type: 'attack', mult: 1.0 }],
            alive: true, poison: 0, defBuff: 0,
            x: 0, y: 0, index: fighters.length
        };
        fighters.push(newFighter);
        syncConfigFromFighters();
        assignInitialPositions();
        renderUnits();
        renderTeamEditor();
    });

    $('#exportSvgBtn').addEventListener('click', exportMapSVG);
    $('#importSvgBtn').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.svg,image/svg+xml';
        input.onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try { importMapSVG(ev.target.result); }
                catch (err) { alert('SVG 解析失败: ' + err.message); }
            };
            reader.readAsText(file);
        };
        input.click();
    });
    $('#clearMapBtn').addEventListener('click', () => {
        if (confirm('确定清空所有地图色块吗？')) {
            mapData.grid = mapData.grid.map(row => row.map(() => null));
            renderMap();
        }
    });
}

function resetBattle() {
    running = false;
    finished = false;
    clearTimeout(battleTimer);
    round = 0;
    fighters = config.fighters.map((src, i) => makeFighter(src, i));
    assignInitialPositions();
    renderUnits();
    renderTeamEditor();
    clearLog();
    const banner = $('#resultBanner');
    if (banner) banner.remove();
    $('#startBtn').disabled = false;
    $('#resetBtn').disabled = false;
}

/* ===== SVG 导入导出 ===== */
function exportMapSVG() {
    const cellSize = 48;
    const w = mapData.width, h = mapData.height;
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w*cellSize} ${h*cellSize}" width="${w*cellSize}" height="${h*cellSize}">\n`;
    svg += `  <rect width="100%" height="100%" fill="#f8fafc"/>\n`;
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const color = mapData.grid[y][x];
            if (color) svg += `  <rect x="${x*cellSize}" y="${y*cellSize}" width="${cellSize}" height="${cellSize}" fill="${color}" stroke="rgba(0,0,0,0.1)" />\n`;
            else svg += `  <rect x="${x*cellSize}" y="${y*cellSize}" width="${cellSize}" height="${cellSize}" fill="none" stroke="#e2e8f0" stroke-dasharray="4 4" />\n`;
        }
    }
    svg += `</svg>`;
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'arena-map.svg'; a.click();
    URL.revokeObjectURL(url);
}

function importMapSVG(svgText) {
    const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
    const svgEl = doc.querySelector('svg');
    if (!svgEl) throw new Error('未找到 SVG 元素');
    const rects = Array.from(svgEl.querySelectorAll('rect'));
    if (rects.length === 0) throw new Error('SVG 中没有矩形');

    let maxX = 0, maxY = 0;
    rects.forEach(r => {
        const x = parseFloat(r.getAttribute('x') || '0');
        const y = parseFloat(r.getAttribute('y') || '0');
        const w = parseFloat(r.getAttribute('width') || '48');
        const h = parseFloat(r.getAttribute('height') || '48');
        maxX = Math.max(maxX, x + w);
        maxY = Math.max(maxY, y + h);
    });
    const cellSize = 48;
    const finalW = Math.min(32, Math.max(1, Math.ceil(maxX / cellSize)));
    const finalH = Math.min(20, Math.max(1, Math.ceil(maxY / cellSize)));
    const newGrid = Array.from({ length: finalH }, () => Array(finalW).fill(null));

    rects.forEach(r => {
        const x = parseFloat(r.getAttribute('x') || '0');
        const y = parseFloat(r.getAttribute('y') || '0');
        const w = parseFloat(r.getAttribute('width') || '48');
        const h = parseFloat(r.getAttribute('height') || '48');
        const fill = (r.getAttribute('fill') || '').toLowerCase();
        let color = null;
        if (fill === '#60a5fa' || fill === 'blue' || fill === '#3b82f6') color = '#60a5fa';
        else if (fill === '#22c55e' || fill === 'green' || fill === '#16a34a') color = '#22c55e';
        else if (fill === '#ef4444' || fill === 'red' || fill === '#dc2626') color = '#ef4444';
        if (!color) return;
        const gx = Math.floor(x / cellSize), gy = Math.floor(y / cellSize);
        const sx = Math.max(1, Math.round(w / cellSize)), sy = Math.max(1, Math.round(h / cellSize));
        for (let dy = 0; dy < sy; dy++)
            for (let dx = 0; dx < sx; dx++) {
                const nx = gx + dx, ny = gy + dy;
                if (nx >= 0 && nx < finalW && ny >= 0 && ny < finalH) newGrid[ny][nx] = color;
            }
    });

    mapData = { grid: newGrid, width: finalW, height: finalH };
    assignInitialPositions();
    renderMap();
    renderUnits();
    const label = $('#mapSizeLabel');
    if (label) label.textContent = finalW + ' × ' + finalH;
}

/* ===== 日志 ===== */
function addLog(text, cls) {
    const list = $('#logList');
    if (!list) return;
    const empty = list.querySelector('.log-empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'log-line ' + (cls || 'info');
    div.innerHTML = text;
    list.insertBefore(div, list.firstChild);
    while (list.children.length > MAX_LOG_LINES) list.removeChild(list.lastChild);
}
function clearLog() {
    const l = $('#logList');
    if (l) l.innerHTML = '<div class="log-empty">等待对战开始…</div>';
}

})();
</script>

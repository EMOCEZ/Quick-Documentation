<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反应力挑战 · Mod 版</title>
    <style>
        :root {
            --shadow: rgba(0, 0, 0, 0.04);
            --shadow-sidebar: rgba(0, 0, 0, 0.02);
            --error: #b91c1c;
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --text: #1e293b;
            --text-muted: #64748b;
            --text-faint: #94a3b8;
            --toc-hover-bg: #f1f5f9;
            --code-bg: rgba(0, 0, 0, 0.05);
            --pre-bg: #1e293b;
            --pre-text: #f8fafc;
            --blockquote-bg: rgba(0, 0, 0, 0.02);
            --blockquote-text: #475569;
            --glass-blur: 14px;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.55);
        }
        html[data-theme="dark"] {
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-sidebar: rgba(0, 0, 0, 0.2);
            --error: #f87171;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-faint: #64748b;
            --toc-hover-bg: rgba(255, 255, 255, 0.05);
            --code-bg: rgba(255, 255, 255, 0.1);
            --pre-bg: #0b1220;
            --pre-text: #e2e8f0;
            --blockquote-bg: rgba(255, 255, 255, 0.03);
            --blockquote-text: #cbd5e1;
            --glass-bg: rgba(17, 26, 46, 0.55);
            --glass-border: rgba(255, 255, 255, 0.12);
        }
        html[data-accent="blue"] { --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9; --border:#e2e8f0; --border-strong:#cbd5e1; --accent:#2563eb; --accent-hover:#1d4ed8; --accent-soft:#eff6ff; --accent-border:#3b82f6; }
        html[data-theme="dark"][data-accent="blue"] { --bg:#0b1120; --surface:#111a2e; --surface-2:#1b263e; --border:#2a3b5c; --accent:#60a5fa; --accent-hover:#93c5fd; --accent-soft:#1e3a5f; --accent-border:#60a5fa; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { color-scheme: light dark; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            min-height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
            overflow-y: auto;
            height: 100vh;
            position: sticky;
            top: 0;
            box-shadow: 2px 0 8px var(--shadow-sidebar);
            transition: background-color 0.25s ease, border-color 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            margin: 0;
            word-break: break-word;
        }
        .theme-toggle {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            flex-shrink: 0;
        }
        .theme-toggle:hover { background: var(--toc-hover-bg); color: var(--text); }

        .sidebar-home {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-home .home-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.6rem;
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 6px;
            transition: background 0.15s, color 0.15s;
            background: var(--surface-2);
            border: 1px solid var(--border);
            justify-content: center;
        }

        .toc-list { list-style: none; padding-left: 0; margin: 0; flex: 1; }
        .toc-list li { margin: 0.3rem 0; }
        .toc-list a {
            display: block;
            padding: 0.35rem 0.5rem;
            color: var(--text);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            word-break: break-word;
            border-left: 3px solid transparent;
            cursor: pointer;
        }
        .toc-list a:hover { background-color: var(--toc-hover-bg); }
        .toc-list a.active { background-color: var(--accent-soft); color: var(--accent); border-left-color: var(--accent-border); font-weight: 500; }

        .mod-loader {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
        }
        .mod-loader label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .mod-loader .mod-input-row {
            display: flex;
            gap: 0.4rem;
        }
        .mod-loader input {
            flex: 1;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.35rem 0.5rem;
            font-size: 0.85rem;
            color: var(--text);
            font-family: inherit;
            outline: none;
        }
        .mod-loader input:focus { border-color: var(--accent-border); }
        .mod-loader button {
            padding: 0.35rem 0.6rem;
            font-size: 0.85rem;
        }
        .mod-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            word-break: break-word;
        }
        .mod-status.error { color: var(--error); }
        .mod-status.loaded { color: #16a34a; }

        .main-content {
            flex: 1;
            padding: 2rem 2.5rem;
            max-width: 1000px;
            margin: 0 auto;
            overflow-x: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #game-container {
            background: var(--surface);
            border-radius: 12px;
            padding: 2rem 2.5rem;
            box-shadow: 0 4px 12px var(--shadow);
            border: 1px solid var(--border);
            min-height: 200px;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            border-bottom: 2px solid var(--accent-border);
            padding-bottom: 0.3rem;
            margin-bottom: 0.6em;
            color: var(--text);
        }
        .game-info {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
            margin: 1.25rem 0;
        }
        .stats {
            display: flex;
            gap: 1.5rem;
            background: var(--surface-2);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            border: 1px solid var(--border);
        }
        .stat-item { display: flex; align-items: baseline; gap: 0.4rem; }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-weight: 700; font-size: 1.4rem; color: var(--accent); font-family: 'SF Mono', monospace; }

        .badge {
            display: inline-block;
            padding: 0.05rem 0.45rem;
            border-radius: 999px;
            font-size: 0.78em;
            font-weight: 600;
            border: 1px solid var(--accent-border);
            background: var(--accent-soft);
            color: var(--accent);
            vertical-align: 1px;
        }

        button {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            padding: 0.35rem 0.85rem;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        button:hover {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: var(--accent-border);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px var(--shadow);
        }
        button:active {
            transform: translateY(1px) scale(0.97);
            box-shadow: none;
        }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .target-area {
            position: relative;
            width: 100%;
            min-height: 420px;
            background: var(--surface-2);
            border-radius: 12px;
            border: 2px dashed var(--border-strong);
            margin: 1.5rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: crosshair;
            user-select: none;
            touch-action: none;
            transition: background-color 0.4s, border-color 0.4s;
        }
        .target-area.dragging { cursor: grabbing; }
        .target-area.game-over-flash {
            animation: gameOverFlash 0.8s ease-out;
        }
        @keyframes gameOverFlash {
            0% { background-color: var(--surface-2); }
            15% { background-color: rgba(185, 28, 28, 0.25); border-color: var(--error); }
            30% { background-color: var(--surface-2); }
            45% { background-color: rgba(185, 28, 28, 0.15); border-color: var(--error); }
            60% { background-color: var(--surface-2); }
            100% { background-color: var(--surface-2); }
        }
        .target-area.shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-8px); }
            30% { transform: translateX(8px); }
            45% { transform: translateX(-6px); }
            60% { transform: translateX(6px); }
            75% { transform: translateX(-3px); }
            90% { transform: translateX(3px); }
        }

        .target {
            position: absolute;
            border-radius: 50%;
            border: 3px solid var(--surface);
            box-shadow: 0 0 0 2px var(--border-strong), 0 8px 20px var(--shadow);
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            user-select: none;
            animation: pop 0.2s ease-out;
            z-index: 2;
        }
        .target:hover { transform: scale(1.1); }
        .target .op-label {
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            background: var(--surface);
            padding: 1px 6px;
            border-radius: 10px;
            white-space: nowrap;
            font-weight: 600;
            border: 1px solid var(--border-strong);
            color: var(--text);
        }

        .target.disappearing {
            animation: disappearAnim 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
            pointer-events: none;
        }
        @keyframes disappearAnim {
            0% { transform: scale(1); opacity: 1; }
            30% { transform: scale(1.3); opacity: 0.95; }
            100% { transform: scale(0.05); opacity: 0; }
        }
        .target.disappearing::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 4px solid var(--disappear-ring-color, var(--error));
            animation: ringExpand 0.4s ease-out forwards;
        }
        @keyframes ringExpand {
            0% { transform: scale(0.7); opacity: 1; border-width: 4px; }
            100% { transform: scale(2.4); opacity: 0; border-width: 1px; }
        }

        .target.hold-charge.charging {
            animation: chargePulse 0.5s infinite alternate;
        }
        @keyframes chargePulse {
            from { box-shadow: 0 0 0 2px var(--charge-border, #fdba74), 0 8px 20px var(--shadow); }
            to { box-shadow: 0 0 0 6px var(--charge-border, #fb923c), 0 8px 24px var(--shadow); }
        }
        .target.hold-charge .charge-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.9);
            opacity: 0;
            transition: opacity 0.1s;
            pointer-events: none;
        }
        .target.hold-charge.charging .charge-ring { opacity: 1; }

        .target .multi-progress-ring {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .target .multi-progress-ring.visible { opacity: 1; }

        .swipe-arrow {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            opacity: 0.8;
            pointer-events: none;
        }

        .track-line {
            position: absolute;
            z-index: 1;
            pointer-events: none;
            border-radius: 4px;
            transition: opacity 0.35s ease;
        }
        .track-line.fading { opacity: 0; }
        .track-end {
            position: absolute;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            animation: pulse 1.5s infinite;
            transition: opacity 0.35s ease;
        }
        .track-end.fading { opacity: 0 !important; }
        .track-end .end-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.65rem;
            color: white;
            font-weight: 700;
            white-space: nowrap;
        }
        @keyframes targetPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        .drop-zone {
            position: absolute;
            border-radius: 50%;
            border: 3px dashed #10b981;
            background: rgba(16, 185, 129, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #059669;
            font-weight: 700;
            font-size: 0.7rem;
            text-align: center;
            pointer-events: none;
            animation: pulse 1.5s infinite;
            z-index: 1;
            transition: opacity 0.35s ease;
        }
        .drop-zone.fading { opacity: 0; animation: none; }
        html[data-theme="dark"] .drop-zone {
            color: #6ee7b7;
            border-color: #6ee7b7;
            background: rgba(110, 231, 183, 0.1);
        }

        .draw-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .draw-canvas.visible { opacity: 1; }

        .circle-start-hint {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed #06b6d4;
            pointer-events: none;
            z-index: 3;
            opacity: 0.6;
            animation: pulse 1.5s infinite;
            transition: opacity 0.35s;
        }
        .circle-start-hint.fading { opacity: 0; }
        html[data-theme="dark"] .circle-start-hint {
            border-color: #22d3ee;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        @keyframes pop {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .message-box {
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            border-left: 4px solid var(--accent);
            border-radius: 6px;
            padding: 1rem 1.25rem;
            margin-top: 1rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .message-box strong { color: var(--text); }
        .message-box.error { border-left-color: var(--error); }
        .message-box.success { border-left-color: #16a34a; }

        .flex-row { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-top: 0.8rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .legend-item { display: flex; align-items: center; gap: 0.3rem; }
        .legend-dot {
            width: 14px; height: 14px; border-radius: 50%;
            border: 2px solid var(--surface);
            box-shadow: 0 0 0 1px var(--border-strong);
            flex-shrink: 0;
        }

        @media (max-width: 700px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 340px; position: relative; border-right: none; border-bottom: 1px solid var(--border); padding: 1rem; }
            .main-content { padding: 1rem; justify-content: flex-start; }
            #game-container { padding: 1.5rem; }
            .target-area { min-height: 360px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 id="toc-title">🎮 游戏控制</h3>
            <button class="theme-toggle" id="theme-toggle" title="切换主题" aria-label="切换主题">🌙</button>
        </div>
        <div class="sidebar-home">
            <div class="home-btn" style="cursor:default; background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border);" id="mod-title">🎯 九重操作</div>
        </div>
        <ul class="toc-list" id="toc-list">
            <li><a class="active" data-action="newGame" style="cursor:pointer;">🔄 新游戏</a></li>
            <li><a data-action="difficulty" style="cursor:pointer;">⚙️ 难度：<span id="difficulty-label">中等</span></a></li>
            <li><a data-action="toggleSound" style="cursor:pointer;">🔊 声音：<span id="sound-label">开</span></a></li>
            <li style="margin-top:1rem; border-top:1px solid var(--border); padding-top:0.5rem; color:var(--text-muted); font-size:0.75rem; list-style:none; line-height:1.9;" id="ops-list"></li>
        </ul>
        <div class="mod-loader">
            <label>Mod Loader</label>
            <div class="mod-input-row">
                <input type="text" id="mod-input" placeholder="mod name (default: main)" value="main">
                <button id="mod-load-btn">Load</button>
            </div>
            <div class="mod-status" id="mod-status">Not loaded (using built-in config)</div>
        </div>
    </aside>

    <div class="main-content">
        <main id="game-container">
            <h1 id="game-title">🎯 九重操作挑战</h1>
            <div class="game-info">
                <div class="stats">
                    <div class="stat-item"><span class="stat-label">得分</span><span class="stat-value" id="score">0</span></div>
                    <div class="stat-item"><span class="stat-label">生命</span><span class="stat-value" id="lives">3</span></div>
                    <div class="stat-item"><span class="stat-label">连击</span><span class="stat-value" id="combo">0</span></div>
                </div>
                <div class="flex-row">
                    <span class="badge" id="difficulty-badge">中等</span>
                    <button id="btn-new">新游戏</button>
                </div>
            </div>

            <div class="target-area" id="target-area">
                <div style="color: var(--text-faint); user-select: none; font-size: 1.2rem;" id="placeholder">点击“新游戏”开始</div>
            </div>

            <div class="legend" id="legend"></div>

            <div class="message-box" id="message">
                <strong>准备开始？</strong> 点击“新游戏”开始。
            </div>
        </main>
    </div>

    <script>
        (function() {
            const THEME_KEY = 'qd-game-theme';
            const htmlEl = document.documentElement;
            const themeToggleBtn = document.getElementById('theme-toggle');

            // ===== 默认配置 =====
            const DEFAULT_CONFIG = {
                name: '九重操作',
                title: '🎯 九重操作挑战',
                sidebarTitle: '🎯 九重操作',
                description: '九种颜色对应九种操作。按住类操作会暂停超时计时器，但松手就失败！',
                difficulties: {
                    easy:   { name: '简单', timeout: 3200, spawnInterval: 1400, targetSize: 80, lifeDeduct: 1 },
                    medium: { name: '中等', timeout: 2400, spawnInterval: 1000, targetSize: 72, lifeDeduct: 1 },
                    hard:   { name: '困难', timeout: 1800, spawnInterval: 700,  targetSize: 64, lifeDeduct: 1 },
                    insane: { name: '疯狂', timeout: 1300, spawnInterval: 500,  targetSize: 56, lifeDeduct: 2 }
                },
                defaultDifficulty: 'medium',
                operations: [
                    { id: 'normal', label: '左键', points: 1, type: 'click', button: 0,
                      lightGradient: ['#3b82f6', '#2563eb'], darkGradient: ['#2563eb', '#1d4ed8'],
                      labelColor: '#1d4ed8', borderColor: '#60a5fa', darkBorderColor: '#3b82f6', hint: '左键单击' },
                    { id: 'right', label: '右键', points: 2, type: 'click', button: 2,
                      lightGradient: ['#ef4444', '#b91c1c'], darkGradient: ['#dc2626', '#7f1d1d'],
                      labelColor: '#b91c1c', borderColor: '#f87171', darkBorderColor: '#ef4444', hint: '右键单击' },
                    { id: 'drag', label: '拖拽', points: 3, type: 'drag',
                      lightGradient: ['#34d399', '#10b981'], darkGradient: ['#10b981', '#059669'],
                      labelColor: '#047857', borderColor: '#6ee7b7', darkBorderColor: '#34d399', hint: '拖到光圈' },
                    { id: 'double', label: '点两次', points: 3, type: 'multiClick', count: 2, resetTimerOnClick: true,
                      lightGradient: ['#a78bfa', '#7c3aed'], darkGradient: ['#8b5cf6', '#6d28d9'],
                      labelColor: '#6d28d9', borderColor: '#c4b5fd', darkBorderColor: '#a78bfa', hint: '点击两次' },
                    { id: 'hold', label: '按住不放', points: 4, type: 'hold', duration: 800, pauseTimer: true, releaseCancel: true,
                      lightGradient: ['#fb923c', '#f97316'], darkGradient: ['#f97316', '#ea580c'],
                      labelColor: '#c2410c', borderColor: '#fdba74', darkBorderColor: '#fdba74', hint: '按住直到蓄满' },

            let CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));

            function initAudio() {
                if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            function playBeep(type) {
                if (!soundEnabled) return;
                initAudio();
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    const now = audioCtx.currentTime;
                    const freqMap = { hit: 880, miss: 220, timeout: 330, dragStart: 660, dragDrop: 1320, charge: 440, circle: 1760, tap: 550, holdFail: 180, swipe: 990 };
                    const f = freqMap[type] || 660;
                    osc.frequency.value = f;
                    osc.type = type === 'miss' || type === 'holdFail' ? 'sawtooth' : (type === 'charge' ? 'square' : 'sine');
                    gain.gain.value = 0.06 + (type === 'hit' || type === 'dragDrop' || type === 'circle' ? 0.04 : 0);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (type === 'circle' ? 0.3 : 0.15));
                    osc.stop(now + 0.3);
                } catch (e) {}
            }
            function playGameOverSound() {
                if (!soundEnabled) return;

                    const now = audioCtx.currentTime;
                    const notes = [523.25, 440, 349.23, 261.63];
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.frequency.value = freq; osc.type = 'triangle';
                        const st = now + i * 0.15;
                        gain.gain.setValueAtTime(0.12, st);
                        gain.gain.exponentialRampToValueAtTime(0.001, st + 0.4);
                        osc.start(st); osc.stop(st + 0.45);
                    });
                } catch (e) {}
            }

            // ===== 主题 =====

                localStorage.setItem(THEME_KEY, theme);

            // ===== 超时计时器 =====
            function startTargetTimeout() {
                stopTargetTimeout();

                targetTimeoutStart = performance.now();
                targetTimeoutPaused = false;

            }
            function pauseTargetTimeout() {
                if (targetTimeoutPaused || !targetTimeoutId) return;
                clearTimeout(targetTimeoutId); targetTimeoutId = null;
                const elapsed = performance.now() - targetTimeoutStart;
                targetTimeoutRemaining = Math.max(0, targetTimeoutRemaining - elapsed);
                targetTimeoutPaused = true;
            }
            function resumeTargetTimeout() {
                if (!targetTimeoutPaused) return;

                if (targetTimeoutRemaining > 0) targetTimeoutId = setTimeout(onTargetTimeout, targetTimeoutRemaining);

            function stopTargetTimeout() {
                if (targetTimeoutId) { clearTimeout(targetTimeoutId); targetTimeoutId = null; }
                targetTimeoutPaused = false;

            function animateAndCleanup(onComplete) {

            function ensureDrawCanvas() {

            function hitTarget(points, msg) {

            function buildTrackForStep(op) {
                const areaRect = targetArea.getBoundingClientRect();
                const size = difficulty.targetSize;
                const tRect = currentTarget.getBoundingClientRect();
                const centerX = tRect.left - areaRect.left + tRect.width / 2;
                const centerY = tRect.top - areaRect.top + tRect.height / 2;
                const isDark = currentTheme === 'dark';
                const trackColor = isDark
                    ? (op.darkGradient ? op.darkGradient[0] : (op.color || '#eab308'))
                    : (op.lightGradient ? op.lightGradient[0] : (op.color || '#eab308'));

                if (op.axis === 'h') {
                    const goRight = Math.random() < 0.5;
                    const endX = goRight ? (areaRect.width - 20) : 20;
                    const trackWidth = Math.abs(endX - centerX);
                    if (trackWidth < size * 1.5) return;
                    const line = document.createElement('div');
                    line.className = 'track-line';
                    line.style.height = '6px';
                    line.style.left = Math.min(centerX, endX) + 'px';
                    line.style.top = (centerY - 3) + 'px';
                    line.style.width = trackWidth + 'px';
                    line.style.background = `repeating-linear-gradient(90deg, ${trackColor} 0 10px, transparent 10px 18px)`;
                    line.style.boxShadow = `0 0 10px ${trackColor}88`;
                    targetArea.appendChild(line); currentTrackEls.push(line);
                    const startDot = document.createElement('div');
                    startDot.className = 'track-end';
                    startDot.style.width = '18px'; startDot.style.height = '18px';
                    startDot.style.background = trackColor;
                    startDot.style.left = (centerX - 9) + 'px'; startDot.style.top = (centerY - 9) + 'px';
                    startDot.style.opacity = '0.4';
                    startDot.style.boxShadow = `0 0 0 2px ${trackColor}`;
                    targetArea.appendChild(startDot); currentTrackEls.push(startDot);
                    const endDot = document.createElement('div');
                    endDot.className = 'track-end';
                    endDot.style.width = '24px'; endDot.style.height = '24px';
                    endDot.style.background = trackColor;
                    endDot.style.left = (endX - 12) + 'px'; endDot.style.top = (centerY - 12) + 'px';
                    endDot.style.boxShadow = `0 0 0 3px ${trackColor}, 0 0 20px ${trackColor}99`;
                    endDot.style.animation = 'targetPulse 1s infinite';
                    const endLabel = document.createElement('span');
                    endLabel.className = 'end-label';
                    endLabel.textContent = goRight ? '→' : '←';
                    endDot.appendChild(endLabel);
                    targetArea.appendChild(endDot); currentTrackEls.push(endDot);
                    swipeTrack = { axis: 'h', startX: currentTarget.offsetLeft, startY: currentTarget.offsetTop, centerY: centerY, endCenterX: endX, dir: goRight ? 1 : -1, size: size };
                } else {
                    const goDown = Math.random() < 0.5;
                    const endY = goDown ? (areaRect.height - 20) : 20;
                    const trackHeight = Math.abs(endY - centerY);
                    if (trackHeight < size * 1.5) return;
                    const line = document.createElement('div');
                    line.className = 'track-line';
                    line.style.width = '6px';
                    line.style.top = Math.min(centerY, endY) + 'px';
                    line.style.left = (centerX - 3) + 'px';
                    line.style.height = trackHeight + 'px';
                    line.style.background = `repeating-linear-gradient(180deg, ${trackColor} 0 10px, transparent 10px 18px)`;
                    line.style.boxShadow = `0 0 10px ${trackColor}88`;
                    targetArea.appendChild(line); currentTrackEls.push(line);
                    const startDot = document.createElement('div');
                    startDot.className = 'track-end';
                    startDot.style.width = '22px'; startDot.style.height = '22px';
                    startDot.style.background = trackColor;
                    startDot.style.left = (centerX - 11) + 'px'; startDot.style.top = (centerY - 11) + 'px';
                    startDot.style.opacity = '0.4';
                    startDot.style.boxShadow = `0 0 0 2px ${trackColor}`;
                    targetArea.appendChild(startDot); currentTrackEls.push(startDot);
                    const endDot = document.createElement('div');
                    endDot.className = 'track-end';
                    endDot.style.width = '28px'; endDot.style.height = '28px';
                    endDot.style.background = trackColor;
                    endDot.style.left = (centerX - 14) + 'px'; endDot.style.top = (endY - 14) + 'px';
                    endDot.style.boxShadow = `0 0 0 3px ${trackColor}, 0 0 24px ${trackColor}99`;
                    endDot.style.animation = 'targetPulse 1s infinite';
                    const endLabel = document.createElement('span');
                    endLabel.className = 'end-label';
                    endLabel.textContent = goDown ? '↓' : '↑';
                    endDot.appendChild(endLabel);
                    targetArea.appendChild(endDot); currentTrackEls.push(endDot);
                    swipeTrack = { axis: 'v', startX: currentTarget.offsetLeft, startY: currentTarget.offsetTop, centerX: centerX, endCenterY: endY, dir: goDown ? 1 : -1, size: size };
                }
            }

            function buildDropZoneForStep(op) {
                const areaRect = targetArea.getBoundingClientRect();
                const size = difficulty.targetSize;
                const zoneSize = size + 10;
                const maxDropX = areaRect.width - zoneSize;
                const maxDropY = areaRect.height - zoneSize;
                const tRect = currentTarget.getBoundingClientRect();
                const centerX = tRect.left - areaRect.left + tRect.width / 2;
                const centerY = tRect.top - areaRect.top + tRect.height / 2;
                let dropX = 0, dropY = 0;
                for (let attempt = 0; attempt < 15; attempt++) {
                    dropX = Math.random() * Math.max(0, maxDropX);
                    dropY = Math.random() * Math.max(0, maxDropY);
                    const dist = Math.hypot((dropX + zoneSize / 2) - centerX, (dropY + zoneSize / 2) - centerY);
                    if (dist > size * 1.6) break;
                }
                const zone = document.createElement('div');
                zone.className = 'drop-zone';
                zone.style.width = zoneSize + 'px'; zone.style.height = zoneSize + 'px';
                zone.style.left = dropX + 'px'; zone.style.top = dropY + 'px';
                zone.textContent = '拖到这里';
                if (op.borderColor) { zone.style.borderColor = op.borderColor; zone.style.color = op.labelColor || op.borderColor; }
                targetArea.appendChild(zone);
                currentDropZone = zone;
            }

            // ===== 生成靶心 =====
            function spawnTarget() {
                if (!gameActive) return;
                cleanupTarget();
                stopTargetTimeout();
                multiClickCount = 0;

                const areaRect = targetArea.getBoundingClientRect();
                const size = difficulty.targetSize;
                const maxX = areaRect.width - size;
                const maxY = areaRect.height - size;
                if (maxX <= 0 || maxY <= 0) { spawnTimeoutId = setTimeout(spawnTarget, 100); return; }
                if (OPERATIONS.length === 0) { showMessage('Mod 没有定义任何操作，请检查配置。', true); return; }

                const op = OPERATIONS[Math.floor(Math.random() * OPERATIONS.length)];
                currentOp = op;
                currentTargetType = op.id;
                const x = Math.random() * maxX;
                const y = Math.random() * maxY;
                const centerX = x + size / 2;
                const centerY = y + size / 2;
                const isDark = currentTheme === 'dark';

                if (op.type === 'drag') {
                    const zoneSize = size + 10;
                    const maxDropX = areaRect.width - zoneSize;
                    const maxDropY = areaRect.height - zoneSize;
                    let dropX = 0, dropY = 0;
                    for (let attempt = 0; attempt < 15; attempt++) {
                        dropX = Math.random() * Math.max(0, maxDropX);
                        dropY = Math.random() * Math.max(0, maxDropY);
                        const dist = Math.hypot((dropX + zoneSize / 2) - centerX, (dropY + zoneSize / 2) - centerY);
                        if (dist > size * 1.6) break;
                    }
                    const zone = document.createElement('div');
                    zone.className = 'drop-zone';
                    zone.style.width = zoneSize + 'px'; zone.style.height = zoneSize + 'px';
                    zone.style.left = dropX + 'px'; zone.style.top = dropY + 'px';
                    zone.textContent = '拖到这里';
                    if (op.borderColor) { zone.style.borderColor = op.borderColor; zone.style.color = op.labelColor || op.borderColor; }
                    targetArea.appendChild(zone);
                    currentDropZone = zone;
                }

                if (op.type === 'track') {
                    const trackColor = isDark
                        ? (op.darkGradient ? op.darkGradient[0] : (op.color || '#eab308'))
                        : (op.lightGradient ? op.lightGradient[0] : (op.color || '#eab308'));
                    if (op.axis === 'h') {
                        const goRight = Math.random() < 0.5;
                        const endX = goRight ? (areaRect.width - 20) : 20;
                        const trackWidth = Math.abs(endX - centerX);
                        if (trackWidth < size * 1.5) { spawnTimeoutId = setTimeout(spawnTarget, 50); return; }
                        const line = document.createElement('div');
                        line.className = 'track-line';
                        line.style.height = '6px';
                        line.style.left = Math.min(centerX, endX) + 'px';
                        line.style.top = (centerY - 3) + 'px';
                        line.style.width = trackWidth + 'px';
                        line.style.background = `repeating-linear-gradient(90deg, ${trackColor} 0 10px, transparent 10px 18px)`;
                        line.style.boxShadow = `0 0 10px ${trackColor}88`;
                        targetArea.appendChild(line); currentTrackEls.push(line);
                        const startDot = document.createElement('div');
                        startDot.className = 'track-end';
                        startDot.style.width = '18px'; startDot.style.height = '18px';
                        startDot.style.background = trackColor;
                        startDot.style.left = (centerX - 9) + 'px'; startDot.style.top = (centerY - 9) + 'px';
                        startDot.style.opacity = '0.4'; startDot.style.boxShadow = `0 0 0 2px ${trackColor}`;
                        targetArea.appendChild(startDot); currentTrackEls.push(startDot);
                        const endDot = document.createElement('div');
                        endDot.className = 'track-end';
                        endDot.style.width = '24px'; endDot.style.height = '24px';
                        endDot.style.background = trackColor;
                        endDot.style.left = (endX - 12) + 'px'; endDot.style.top = (centerY - 12) + 'px';
                        endDot.style.boxShadow = `0 0 0 3px ${trackColor}, 0 0 20px ${trackColor}99`;
                        endDot.style.animation = 'targetPulse 1s infinite';
                        const endLabel = document.createElement('span');
                        endLabel.className = 'end-label';
                        endLabel.textContent = goRight ? '→' : '←';
                        endDot.appendChild(endLabel);
                        targetArea.appendChild(endDot); currentTrackEls.push(endDot);
                        swipeTrack = { axis: 'h', startX: x, startY: y, centerY: centerY, endCenterX: endX, dir: goRight ? 1 : -1, size: size };
                    } else {
                        const goDown = Math.random() < 0.5;
                        const endY = goDown ? (areaRect.height - 20) : 20;
                        const trackHeight = Math.abs(endY - centerY);
                        if (trackHeight < size * 1.5) { spawnTimeoutId = setTimeout(spawnTarget, 50); return; }
                        const line = document.createElement('div');
                        line.className = 'track-line';
                        line.style.width = '6px';
                        line.style.top = Math.min(centerY, endY) + 'px';
                        line.style.left = (centerX - 3) + 'px';
                        line.style.height = trackHeight + 'px';
                        line.style.background = `repeating-linear-gradient(180deg, ${trackColor} 0 10px, transparent 10px 18px)`;
                        line.style.boxShadow = `0 0 10px ${trackColor}88`;
                        targetArea.appendChild(line); currentTrackEls.push(line);
                        const startDot = document.createElement('div');
                        startDot.className = 'track-end';
                        startDot.style.width = '22px'; startDot.style.height = '22px';
                        startDot.style.background = trackColor;
                        startDot.style.left = (centerX - 11) + 'px'; startDot.style.top = (centerY - 11) + 'px';
                        startDot.style.opacity = '0.4'; startDot.style.boxShadow = `0 0 0 2px ${trackColor}`;
                        targetArea.appendChild(startDot); currentTrackEls.push(startDot);
                        const endDot = document.createElement('div');
                        endDot.className = 'track-end';
                        endDot.style.width = '28px'; endDot.style.height = '28px';
                        endDot.style.background = trackColor;
                        endDot.style.left = (centerX - 14) + 'px'; endDot.style.top = (endY - 14) + 'px';
                        endDot.style.boxShadow = `0 0 0 3px ${trackColor}, 0 0 24px ${trackColor}99`;
                        endDot.style.animation = 'targetPulse 1s infinite';
                        const endLabel = document.createElement('span');
                        endLabel.className = 'end-label';
                        endLabel.textContent = goDown ? '↓' : '↑';
                        endDot.appendChild(endLabel);
                        targetArea.appendChild(endDot); currentTrackEls.push(endDot);
                        swipeTrack = { axis: 'v', startX: x, startY: y, centerX: centerX, endCenterY: endY, dir: goDown ? 1 : -1, size: size };
                    }
                }

                if (op.type === 'circle') {
                    const hint = document.createElement('div');
                    hint.className = 'circle-start-hint';
                    hint.style.width = (size + 30) + 'px';
                    hint.style.height = (size + 30) + 'px';
                    hint.style.left = (x - 15) + 'px'; hint.style.top = (y - 15) + 'px';
                    if (op.borderColor) hint.style.borderColor = op.borderColor;
                    targetArea.appendChild(hint);
                    circleStartHintEl = hint;
                    ensureDrawCanvas();
                }

                const target = document.createElement('div');
                target.className = 'target';
                target.style.width = size + 'px'; target.style.height = size + 'px';
                target.style.left = x + 'px'; target.style.top = y + 'px';
                target.style.fontSize = Math.floor(size * 0.4) + 'px';
                target.textContent = '🎯';
                applyOpStyles(op, target, isDark);

                const label = document.createElement('span');
                label.className = 'op-label';
                label.textContent = op.label || op.id;
                if (op.labelColor) label.style.color = op.labelColor;
                if (op.borderColor) label.style.borderColor = op.borderColor;
                target.appendChild(label);

                if (op.type === 'multiClick') {
                    const ring = document.createElement('div');
                    ring.className = 'multi-progress-ring';
                    const border = isDark ? (op.darkBorderColor || op.borderColor) : op.borderColor;
                    ring.style.borderRadius = '50%';
                    ring.style.boxShadow = `0 0 0 3px ${border || '#a78bfa'}`;
                    ring.style.opacity = '0';
                    target.appendChild(ring);
                }
                if (op.type === 'hold') {
                    const ring = document.createElement('div');
                    ring.className = 'charge-ring';
                    target.appendChild(ring);
                    currentHoldDuration = op.duration || 800;
                }
                if (op.type === 'track') {
                    const arr = document.createElement('div');
                    arr.className = 'swipe-arrow';
                    arr.textContent = op.axis === 'h' ? '↔' : '↕';
                    target.appendChild(arr);
                }

                target.addEventListener('mousedown', onTargetMouseDown);
                target.addEventListener('click', onTargetClick);
                target.addEventListener('contextmenu', onTargetContextMenu);
                targetArea.appendChild(target);
                currentTarget = target;
                circleTargetEl = target;
                startTargetTimeout();
            }

            function checkCircleCompletion() {
                if (circlePoints.length < 15) return false;
                const first = circlePoints[0];
                const last = circlePoints[circlePoints.length - 1];
                if (Math.hypot(last.x - first.x, last.y - first.y) > 40) return false;
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                for (const p of circlePoints) {
                    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
                    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
                }
                const bboxW = maxX - minX, bboxH = maxY - minY;
                if (bboxW < 30 || bboxH < 30) return false;
                const tRect = circleTargetEl.getBoundingClientRect();
                const areaRect = targetArea.getBoundingClientRect();
                const tcx = tRect.left - areaRect.left + tRect.width / 2;
                const tcy = tRect.top - areaRect.top + tRect.height / 2;
                const centerDist = Math.hypot((minX + maxX) / 2 - tcx, (minY + maxY) / 2 - tcy);
                if (centerDist > Math.max(bboxW, bboxH)) return false;
                const radius = Math.max(bboxW, bboxH) / 2;
                let farCount = 0;
                for (const p of circlePoints) {
                    const d = Math.hypot(p.x - tcx, p.y - tcy);
                    if (d > radius * 0.5 && d < radius * 2) farCount++;
                }
                return farCount > circlePoints.length * 0.3;
            }

            function onHoldGlobalEnd(e) {
                if (!holdActive || !currentOp || currentOp.type !== 'hold') return;
                if (e.button !== undefined && e.button !== 0) return;
                if (holdActive && holdProgress < 1) {
                    holdActive = false; holdMouseDown = false;
                    if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
                    if (currentTarget) {
                        currentTarget.classList.remove('charging');
                        const ring = currentTarget.querySelector('.charge-ring');
                        if (ring) ring.style.background = '';
                    }
                    playBeep('holdFail');
                    if (currentOp.releaseCancel !== false) {
                        cancelCurrentTarget('松手太早！需要按住不放直到蓄满');
                        if (gameActive) spawnTimeoutId = setTimeout(spawnTarget, 300);
                    } else {
                        resumeTargetTimeout();
                    }
                }
            }

            function onTargetClick(e) {
                if (!gameActive || !currentTarget || !currentOp) return;
                if (e.button !== 0) return;
                e.stopPropagation();

                if (currentOp.type === 'click') {
                    if (currentOp.button === 0) hitTarget(currentOp.points || 1, `<strong>左键命中${currentOp.label || ''}！</strong> +${currentOp.points || 1} 分`);
                }
                else if (currentOp.type === 'multiClick') {
                    multiClickCount++;
                    playBeep('tap');
                    if (currentOp.resetTimerOnClick) resetTargetTimeout();
                    const ring = currentTarget.querySelector('.multi-progress-ring');
                    const count = currentOp.count || 2;
                    if (ring) {
                        ring.classList.add('visible');
                        const pct = Math.min(multiClickCount / count, 1);
                        ring.style.background = `conic-gradient(${currentOp.labelColor || '#8b5cf6'} ${pct * 360}deg, transparent ${pct * 360}deg)`;
                    }
                    if (multiClickCount < count) {
                        const steps = currentOp.steps;
                        const nextStep = steps && steps[multiClickCount - 1];
                        if (nextStep && nextStep.type && nextStep.type !== 'multiClick') {
                            switchToStep(nextStep);
                        } else {
                            const label = currentTarget.querySelector('.op-label');
                            let hintText = (nextStep && nextStep.hint) ? nextStep.hint : `再点${count - multiClickCount}次`;
                            if (label) label.textContent = hintText;
                            showMessage(`${currentOp.label}靶心：${hintText}！`, false);
                        }
                    } else {
                        hitTarget(currentOp.points || 3, `<strong>${count}次点击命中${currentOp.label}！</strong> +${currentOp.points || 3} 分`);
                    }
                }
                else if (currentOp.type === 'click' && currentOp.button === 2) {
                    cancelCurrentTarget(`操作错误！应右键点击${currentOp.label}`);
                }
            }

            function onTargetContextMenu(e) {
                e.preventDefault();
                if (!gameActive || !currentTarget || !currentOp) return;
                if (currentOp.type === 'click' && currentOp.button === 2) {
                    hitTarget(currentOp.points || 2, `<strong>右键命中${currentOp.label}！</strong> +${currentOp.points || 2} 分`);
                } else if (currentOp.type === 'click' && currentOp.button === 0) {
                    cancelCurrentTarget(`操作错误！应左键点击${currentOp.label}`);
                }
            }

            function onTargetMouseDown(e) {
                if (!gameActive || !currentTarget || !currentOp) return;
                if (e.button !== 0) return;

                if (currentOp.type === 'drag') {
                    e.preventDefault(); e.stopPropagation();
                    isDragging = true; dragTargetEl = currentTarget;
                    targetArea.classList.add('dragging');
                    const rect = currentTarget.getBoundingClientRect();
                    dragOffsetX = e.clientX - rect.left; dragOffsetY = e.clientY - rect.top;
                    playBeep('dragStart');
                    if (currentOp.pauseTimer !== false) pauseTargetTimeout();
                    document.addEventListener('mousemove', onDragMove);
                    document.addEventListener('mouseup', onDragEnd);
                }
                else if (currentOp.type === 'hold') {
                    e.preventDefault(); e.stopPropagation();
                    if (holdActive) return;
                    holdActive = true; holdMouseDown = true;
                    currentTarget.classList.add('charging');
                    const ring = currentTarget.querySelector('.charge-ring');
                    holdStartTime = performance.now();
                    currentHoldDuration = currentOp.duration || 800;
                    playBeep('charge');
                    if (currentOp.pauseTimer !== false) pauseTargetTimeout();
                    document.addEventListener('mouseup', onHoldGlobalEnd);
                    document.addEventListener('mouseleave', onHoldGlobalEnd);
                    holdTimer = setInterval(() => {
                        if (!gameActive || !currentTarget || !currentOp || currentOp.type !== 'hold') {
                            clearInterval(holdTimer); holdTimer = null; holdActive = false;
                            document.removeEventListener('mouseup', onHoldGlobalEnd);
                            document.removeEventListener('mouseleave', onHoldGlobalEnd);
                            resumeTargetTimeout(); return;
                        }
                        if (!holdMouseDown) {
                            clearInterval(holdTimer); holdTimer = null; holdActive = false;
                            document.removeEventListener('mouseup', onHoldGlobalEnd);
                            document.removeEventListener('mouseleave', onHoldGlobalEnd);
                            resumeTargetTimeout(); return;
                        }
                        const elapsed = performance.now() - holdStartTime;
                        holdProgress = Math.min(elapsed / currentHoldDuration, 1);
                        if (ring) ring.style.background = `conic-gradient(rgba(255,255,255,0.9) ${holdProgress * 360}deg, transparent ${holdProgress * 360}deg)`;
                        if (holdProgress >= 1) {
                            clearInterval(holdTimer); holdTimer = null;
                            holdActive = false; holdMouseDown = false;
                            document.removeEventListener('mouseup', onHoldGlobalEnd);
                            document.removeEventListener('mouseleave', onHoldGlobalEnd);
                            if (currentTarget && currentOp && currentOp.type === 'hold') {
                                hitTarget(currentOp.points || 4, `<strong>蓄力成功！</strong> +${currentOp.points || 4} 分`);
                            }
                        }
                    }, 30);
                }
                else if (currentOp.type === 'circle') {
                    e.preventDefault(); e.stopPropagation();
                    ensureDrawCanvas();
                    circleTracking = true; circleMoved = false; circlePoints = [];
                    const rect = targetArea.getBoundingClientRect();
                    const startPt = { x: e.clientX - rect.left, y: e.clientY - rect.top };
                    circlePoints.push(startPt); circleStartPoint = startPt;
                    if (currentTarget) currentTarget.classList.add('drawing');
                    if (circleStartHintEl) circleStartHintEl.style.opacity = '0.2';
                    playBeep('tap');
                    if (currentOp.pauseTimer !== false) pauseTargetTimeout();
                    document.addEventListener('mousemove', onCircleMove);
                    document.addEventListener('mouseup', onCircleEnd);
                }
                else if (currentOp.type === 'track') {
                    e.preventDefault(); e.stopPropagation();
                    if (!swipeTrack) return;
                    swipeTracking = true; swipeEl = currentTarget; swipeTargetType = currentOp.axis;
                    playBeep('swipe');
                    if (currentOp.pauseTimer !== false) pauseTargetTimeout();
                    document.addEventListener('mousemove', onSwipeMove);
                    document.addEventListener('mouseup', onSwipeEnd);
                }
            }

            function onDragMove(e) {
                if (!isDragging || !dragTargetEl || !currentTarget) return;
                e.preventDefault();
                const areaRect = targetArea.getBoundingClientRect();
                let newLeft = e.clientX - areaRect.left - dragOffsetX;
                let newTop = e.clientY - areaRect.top - dragOffsetY;
                const size = difficulty.targetSize;
                newLeft = Math.max(0, Math.min(newLeft, areaRect.width - size));
                newTop = Math.max(0, Math.min(newTop, areaRect.height - size));
                dragTargetEl.style.left = newLeft + 'px';
                dragTargetEl.style.top = newTop + 'px';
            }

            function onDragEnd(e) {
                if (!isDragging) return;
                e.preventDefault();
                const target = dragTargetEl;
                const opType = currentOp ? currentOp.type : null;
                document.removeEventListener('mousemove', onDragMove);
                document.removeEventListener('mouseup', onDragEnd);
                targetArea.classList.remove('dragging');
                isDragging = false; dragTargetEl = null;
                if (!target || !currentTarget || opType !== 'drag') return;
                if (currentDropZone) {
                    const dropRect = currentDropZone.getBoundingClientRect();
                    const targetRect = target.getBoundingClientRect();
                    const tcx = targetRect.left + targetRect.width / 2;
                    const tcy = targetRect.top + targetRect.height / 2;
                    const dcx = dropRect.left + dropRect.width / 2;
                    const dcy = dropRect.top + dropRect.height / 2;
                    if (Math.hypot(tcx - dcx, tcy - dcy) < dropRect.width / 2 + 8) {
                        playBeep('dragDrop');
                        hitTarget(currentOp.points || 3, `<strong>拖拽成功！</strong> +${currentOp.points || 3} 分`);
                        return;
                    }
                }
                cancelCurrentTarget('拖拽失败！松手了但未到光圈');
                if (gameActive) spawnTimeoutId = setTimeout(spawnTarget, 300);
            }

            function onCircleMove(e) {
                if (!circleTracking || !currentTarget || !currentOp || currentOp.type !== 'circle') return;
                e.preventDefault();
                const rect = targetArea.getBoundingClientRect();
                const px = e.clientX - rect.left;
                const py = e.clientY - rect.top;
                circlePoints.push({ x: px, y: py });
                if (!circleMoved && circlePoints.length > 3) {
                    const first = circlePoints[0];
                    const last = circlePoints[circlePoints.length - 1];
                    if (Math.hypot(last.x - first.x, last.y - first.y) > 8) circleMoved = true;
                }
                drawTrail(currentTheme === 'dark'
                    ? (currentOp.darkGradient ? currentOp.darkGradient[1] : currentOp.color)
                    : (currentOp.lightGradient ? currentOp.lightGradient[1] : currentOp.color));
                if (circleMoved && checkCircleCompletion()) {
                    circleTracking = false;
                    document.removeEventListener('mousemove', onCircleMove);
                    document.removeEventListener('mouseup', onCircleEnd);
                    playBeep('circle');
                    setTimeout(() => { if (drawCanvas) drawCanvas.classList.remove('visible'); }, 200);
                    hitTarget(currentOp.points || 5, `<strong>画圈成功！</strong> +${currentOp.points || 5} 分`);
                }
            }

            function onCircleEnd(e) {
                if (!circleTracking) return;
                e.preventDefault();
                circleTracking = false;
                document.removeEventListener('mousemove', onCircleMove);
                document.removeEventListener('mouseup', onCircleEnd);
                clearDrawCanvas();
                if (currentTarget) currentTarget.classList.remove('drawing');
                if (currentTarget && currentOp && currentOp.type === 'circle') {
                    if (!circleMoved) cancelCurrentTarget('画圈失败！松手太早，还没画');
                    else cancelCurrentTarget('画圈失败！松手太早，圈未闭合');
                    if (gameActive) spawnTimeoutId = setTimeout(spawnTarget, 300);
                }
                circlePoints = []; circleStartPoint = null;
            }

            function onSwipeMove(e) {
                if (!swipeTracking || !swipeEl || !currentTarget || !swipeTrack || !currentOp) return;
                e.preventDefault();
                const rect = targetArea.getBoundingClientRect();
                const size = swipeTrack.size;
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                if (swipeTrack.axis === 'h') {
                    let newCenterX = mouseX;
                    const minC = Math.min(swipeTrack.startX + size / 2, swipeTrack.endCenterX);
                    const maxC = Math.max(swipeTrack.startX + size / 2, swipeTrack.endCenterX);
                    newCenterX = Math.max(minC, Math.min(maxC, newCenterX));
                    swipeEl.style.left = (newCenterX - size / 2) + 'px';
                    swipeEl.style.top = (swipeTrack.centerY - size / 2) + 'px';
                    if (Math.abs(newCenterX - swipeTrack.endCenterX) < 15) {
                        swipeTracking = false;
                        document.removeEventListener('mousemove', onSwipeMove);
                        document.removeEventListener('mouseup', onSwipeEnd);
                        playBeep('swipe');
                        hitTarget(currentOp.points || 4, `<strong>沿横线拖到端点成功！</strong> +${currentOp.points || 4} 分`);
                        swipeEl = null; swipeTrack = null;
                        return;
                    }
                } else {
                    let newCenterY = mouseY;
                    const minC = Math.min(swipeTrack.startY + size / 2, swipeTrack.endCenterY);
                    const maxC = Math.max(swipeTrack.startY + size / 2, swipeTrack.endCenterY);
                    newCenterY = Math.max(minC, Math.min(maxC, newCenterY));
                    swipeEl.style.left = (swipeTrack.centerX - size / 2) + 'px';
                    swipeEl.style.top = (newCenterY - size / 2) + 'px';
                    if (Math.abs(newCenterY - swipeTrack.endCenterY) < 15) {
                        swipeTracking = false;
                        document.removeEventListener('mousemove', onSwipeMove);
                        document.removeEventListener('mouseup', onSwipeEnd);
                        playBeep('swipe');
                        hitTarget(currentOp.points || 4, `<strong>沿竖线拖到端点成功！</strong> +${currentOp.points || 4} 分`);
                        swipeEl = null; swipeTrack = null;
                        return;
                    }
                }
            }

            function onSwipeEnd(e) {
                if (!swipeTracking) return;
                e.preventDefault();
                swipeTracking = false;
                document.removeEventListener('mousemove', onSwipeMove);
                document.removeEventListener('mouseup', onSwipeEnd);
                if (currentTarget && currentOp && currentOp.type === 'track') {
                    cancelCurrentTarget('滑动失败！松手了但没拖到端点');
                    if (gameActive) spawnTimeoutId = setTimeout(spawnTarget, 300);
                }
                swipeEl = null; swipeTrack = null;
            }

            function cancelCurrentTarget(reason) {
                if (!gameActive) return;
                stopTargetTimeout();
                multiClickCount = 0;
                isDragging = false;
                if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
                holdActive = false; holdMouseDown = false;
                swipeTracking = false; swipeEl = null; swipeTrack = null;
                circleTracking = false;
                clearDrawCanvas();
                document.removeEventListener('mousemove', onDragMove);
                document.removeEventListener('mouseup', onDragEnd);
                document.removeEventListener('mouseup', onHoldGlobalEnd);
                document.removeEventListener('mouseleave', onHoldGlobalEnd);
                document.removeEventListener('mousemove', onSwipeMove);
                document.removeEventListener('mouseup', onSwipeEnd);
                document.removeEventListener('mousemove', onCircleMove);
                document.removeEventListener('mouseup', onCircleEnd);
                targetArea.classList.remove('dragging');
                if (currentTarget) currentTarget.style.setProperty('--disappear-ring-color', 'var(--error)');
                animateAndCleanup(() => {
                    if (!gameActive) return;
                    loseLife(reason);
                    if (gameActive) spawnTimeoutId = setTimeout(spawnTarget, 300);
                });
            }

            targetArea.addEventListener('click', (e) => {
                if (!gameActive) return;
                if (e.target === targetArea || e.target.id === 'placeholder') {
                    if (currentTarget && !isDragging && !holdActive && !swipeTracking && !circleTracking) {
                        if (currentOp && currentOp.type === 'drag') cancelCurrentTarget('拖拽失败！');
                        else if (currentOp && currentOp.type === 'circle') cancelCurrentTarget('画圈失败！');
                        else if (currentOp && currentOp.type === 'track') cancelCurrentTarget('滑动失败！');
                        else if (!currentOp || currentOp.type !== 'hold') cancelCurrentTarget('打空了！');
                    }
                }
            });
            targetArea.addEventListener('contextmenu', (e) => e.preventDefault());

            function startGame() {
                gameActive = true;
                score = 0; lives = 3; combo = 0; maxCombo = 0;
                updateStats();
                clearAllTimers();
                targetArea.innerHTML = '';
                showMessage('游戏开始！', false);
                playBeep('hit');
                difficulty = DIFFICULTIES[currentDifficulty] || DIFFICULTIES.medium;
                difficultyLabel.textContent = difficulty.name || currentDifficulty;
                difficultyBadge.textContent = difficulty.name || currentDifficulty;
                if (spawnTimeoutId) clearTimeout(spawnTimeoutId);
                spawnTimeoutId = setTimeout(spawnTarget, 100);
            }

            function resetGame() {
                gameActive = false;
                clearAllTimers();
                targetArea.innerHTML = '';
                const placeholder = document.createElement('div');
                placeholder.style.color = 'var(--text-faint)';
                placeholder.style.userSelect = 'none';
                placeholder.style.fontSize = '1.2rem';
                placeholder.textContent = '点击“新游戏”开始';
                targetArea.appendChild(placeholder);
                score = 0; lives = 3; combo = 0; maxCombo = 0;
                updateStats();
                showMessage(CONFIG.description || '<strong>准备开始？</strong>', false);
                document.getElementById('btn-new').disabled = false;
            }

            document.getElementById('btn-new').addEventListener('click', () => { initAudio(); startGame(); });
            document.querySelector('[data-action="newGame"]').addEventListener('click', () => { initAudio(); startGame(); });
            document.querySelector('[data-action="difficulty"]').addEventListener('click', () => {
                const keys = Object.keys(DIFFICULTIES);
                let idx = keys.indexOf(currentDifficulty);
                idx = (idx + 1) % keys.length;
                currentDifficulty = keys[idx];
                difficulty = DIFFICULTIES[currentDifficulty];
                difficultyLabel.textContent = difficulty.name || currentDifficulty;
                difficultyBadge.textContent = difficulty.name || currentDifficulty;
                if (gameActive) showMessage(`难度已切换至 <strong>${difficulty.name || currentDifficulty}</strong>，新参数立即生效。`, false);
                else showMessage(`难度已切换至 <strong>${difficulty.name || currentDifficulty}</strong>。点击新游戏开始。`, false);
            });
            document.querySelector('[data-action="toggleSound"]').addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                soundLabel.textContent = soundEnabled ? '开' : '关';
                showMessage(`声音已${soundEnabled ? '开启' : '关闭'}。`, false);
            });

            function applyConfig(config) {
                const merged = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
                if (config.difficulties) merged.difficulties = config.difficulties;
                if (config.defaultDifficulty) merged.defaultDifficulty = config.defaultDifficulty;
                if (config.operations) merged.operations = config.operations;
                if (config.name) merged.name = config.name;
                if (config.title) merged.title = config.title;
                if (config.sidebarTitle) merged.sidebarTitle = config.sidebarTitle;
                if (config.description) merged.description = config.description;
                if (config.customJS) merged.customJS = config.customJS;
                CONFIG = merged;
                DIFFICULTIES = CONFIG.difficulties;
                OPERATIONS = CONFIG.operations;
                rebuildOpMap();
                currentDifficulty = CONFIG.defaultDifficulty;
                difficulty = DIFFICULTIES[currentDifficulty] || DIFFICULTIES.medium;
                renderUI();
                resetGame();
            }

            async function loadMod(modName) {
                modName = (modName || 'main').trim().replace(/\.json$/i, '');
                const url = `${modName}.json?t=${Date.now()}`;
                modStatusEl.textContent = `Loading ${url}...`;
                modStatusEl.className = 'mod-status';
                let config;
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    config = await res.json();
                } catch (e) {
                    console.warn('Mod fetch failed:', e);
                    if (e.message.includes('404') || e.message.includes('Failed to fetch')) {
                        modStatusEl.textContent = `No ${modName}.json found, using built-in config.`;
                    } else {
                        modStatusEl.textContent = `Load failed: ${e.message}. Using built-in config.`;
                    }
                    modStatusEl.className = 'mod-status error';
                    try { applyConfig(DEFAULT_CONFIG); } catch (e2) { console.error(e2); }
                    return;
                }
                try {
                    applyConfig(config);
                } catch (e) {
                    console.error('applyConfig failed:', e);
                    modStatusEl.textContent = `Config error: ${e.message}. Using built-in config.`;
                    modStatusEl.className = 'mod-status error';
                    try { applyConfig(DEFAULT_CONFIG); } catch (e2) { console.error(e2); }
                    return;
                }
                setTimeout(() => {
                    modStatusEl.textContent = `Loaded: ${modName}.json`;
                    modStatusEl.className = 'mod-status loaded';
                }, 0);
                if (config.customJS) {
                    try {
                        const api = window.__GAME_API__;
                        if (api) new Function('game', 'CONFIG', config.customJS)(api, CONFIG);
                        else console.warn('GAME_API not ready, skipping customJS');
                    } catch (e) {
                        console.warn('customJS error:', e);
                        setTimeout(() => {
                            modStatusEl.textContent = `Loaded: ${modName}.json (customJS error: ${e.message})`;
                            modStatusEl.className = 'mod-status error';
                        }, 0);
                    }
                }
            }

            window.__GAME_API__ = {
                get score() { return score; },
                get lives() { return lives; },
                get combo() { return combo; },
                get gameActive() { return gameActive; },
                get config() { return CONFIG; },
                startGame, resetGame, spawnTarget, hitTarget, loseLife, showMessage, targetArea,
                OPERATIONS: () => OPERATIONS,
                OP_MAP: () => OP_MAP
            };

            const urlParams = new URLSearchParams(window.location.search);
            const initialMod = urlParams.get('mod') || 'main';
            document.getElementById('mod-input').value = initialMod;

            document.getElementById('mod-load-btn').addEventListener('click', () => {
                const name = document.getElementById('mod-input').value || 'main';
                console.log('[Mod] loading:', name);
                loadMod(name);
            });
            document.getElementById('mod-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const name = document.getElementById('mod-input').value || 'main';
                    console.log('[Mod] loading:', name);
                    loadMod(name);
                }
            });

            renderUI();
            resetGame();
            loadMod(initialMod);
        })();
    </script>
</body>
</html>
